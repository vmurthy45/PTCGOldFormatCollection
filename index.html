<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EE2B39">
<title>Vig's Pokémon Collection</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CclipPath id='t'%3E%3Cpath d='M4 50A46 46 0 0 1 96 50Z'/%3E%3C/clipPath%3E%3CclipPath id='b'%3E%3Cpath d='M4 50A46 46 0 0 0 96 50Z'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%2339424B' stroke-width='6'/%3E%3Cpath d='M4 50A46 46 0 0 1 96 50Z' fill='%23F0504A'/%3E%3Cg clip-path='url(%23t)'%3E%3Cellipse cx='80' cy='22' rx='28' ry='32' fill='%23D8413C'/%3E%3C/g%3E%3Cg clip-path='url(%23b)'%3E%3Cellipse cx='80' cy='78' rx='30' ry='26' fill='%23E4E6E9'/%3E%3C/g%3E%3Crect x='4' y='44' width='92' height='12' fill='%2339424B'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23fff'/%3E%3Ccircle cx='50' cy='50' r='13' fill='%2339424B'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23fff'/%3E%3C/svg%3E">
<!-- iOS home-screen icon (needs a real PNG; the SVG favicon above is ignored there) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pokémon">
<!-- launch as a standalone app from the home screen; the Tools tab auto-unlocks
     in that mode (see applyToolsGate). Safari / QR visitors stay gated. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#EE2B39; --red-dark:#C81E2B; --charcoal:#3B4048; --charcoal-dark:#2B2F35;
    --ink:#2b2f35; --muted:#7a828d; --line:#e2c9cc; --bg:#f5f2f2; --card:#ffffff;
    --band-a:#fdeced; --band-b:#f8f5f5; --cnt-bg:#fbd9dc; --steel:#5a6470;
    --mark-bg:#ffe58a; --mark-ink:#2b2f35; --overlay:rgba(20,18,19,.6);
    --pokeball-ink:#202225; --shadow:rgba(59,64,72,.14);
    --chip-bg:#ffffff; --rules-header:#202225; --rules-panel:#ffffff;
    --miss-red-line:#d5303b; --miss-red-bg:rgba(213,48,59,.13);
    --miss-orange-line:#d9820f; --miss-orange-bg:rgba(224,138,30,.16);
    /* print-type pips: Authentic / World Champs / Proxy / Missing */
    --pip-auth:#2FA84A; --pip-wc:#9AA4B2; --pip-proxy:#3B82F6; --pip-miss:#d5303b;
  }
  :root[data-theme="dark"]{
    /* Only the background/surface colors change for dark mode - the red
       accent and pokeball icon stay pinned to the same values as light mode.
       --charcoal/--charcoal-dark are the exception: they're real text colors
       used inside guide content (headings, bold text) on the card background,
       so they still need to flip light-on-dark or that text becomes
       unreadable. --chip-bg/--rules-header/--rules-panel are a notch
       lighter than --card/--pokeball-ink so the year filters and the Turn
       1 Rules box don't blend into the page background. */
    --charcoal:#c7cbd1; --charcoal-dark:#f1f1f3;
    --ink:#e8e8ea; --muted:#9099a3; --line:#33383f; --bg:#131417; --card:#1c1f24;
    --band-a:#2a1c1e; --band-b:#20232a; --cnt-bg:#3a2226; --steel:#9099a3;
    --overlay:rgba(0,0,0,.75); --shadow:rgba(0,0,0,.45);
    --chip-bg:#262b32; --rules-header:#2c3138; --rules-panel:#20242b;
    /* Slightly stronger missing-row tints so they read on the dark card. */
    --miss-red-bg:rgba(213,48,59,.24); --miss-orange-bg:rgba(224,138,30,.24);
    --pip-wc:#8791a0; --pip-proxy:#4C8DF6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--red);
    color:#fff; padding:0; box-shadow:0 4px 16px var(--shadow);
  }
  .head-inner{
    max-width:820px; margin:0 auto; display:flex; align-items:center; gap:14px;
    padding:15px 18px; padding-top:calc(15px + env(safe-area-inset-top));
  }
  header svg{width:42px; height:42px; flex:0 0 auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  header h1{
    font-family:'Poppins',sans-serif; font-size:19px; margin:0; font-weight:700;
    letter-spacing:.2px; line-height:1.2;
  }
  header .sub{font-size:12.5px; opacity:.88; margin-top:2px; font-weight:500; letter-spacing:.1px}
  .theme-toggle{
    margin-left:auto; flex:0 0 auto; width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.14); color:#fff;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15); transition:background .15s,transform .15s;
  }
  .theme-toggle:hover{background:rgba(255,255,255,.24); transform:translateY(-1px)}
  /* thin charcoal accent line under header, echoing pokeball seam */
  .seam{height:4px; background:var(--pokeball-ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .wrap{max-width:820px; margin:0 auto; padding:16px 12px 40px}
  .tabs{display:flex; gap:8px; margin-bottom:18px; border-bottom:1px solid var(--line)}
  .tab-btn{
    padding:11px 18px; border:none; background:transparent; cursor:pointer;
    font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; color:var(--muted);
    border-bottom:3px solid transparent; margin-bottom:-1px; transition:color .15s,border-color .15s;
  }
  .tab-btn:hover{color:var(--red-dark)}
  .tab-btn.active{color:var(--red-dark); border-bottom-color:var(--red)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  /* sub-switcher inside the Tools tab */
  .subtabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .subtab-btn{
    padding:8px 15px; border:1px solid var(--line); background:var(--chip-bg); cursor:pointer;
    font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; color:var(--muted);
    border-radius:999px; transition:background .15s,color .15s,border-color .15s;
  }
  .subtab-btn:hover{color:var(--red-dark)}
  .subtab-btn.active{background:var(--red); color:#fff; border-color:var(--red)}
  .subtab-panel{display:none}
  .subtab-panel.active{display:block}
  /* Cards to Get */
  .ctg-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap}
  .ctg-head .stats{margin:0}
  .ctg-copy-btn{border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px;
    cursor:pointer; transition:background .12s,color .12s,border-color .12s; white-space:nowrap}
  .ctg-copy-btn:hover{border-color:var(--red); color:var(--red-dark); background:var(--band-a)}
  .ctg-copy-btn.copied{background:var(--pip-auth); color:#fff; border-color:var(--pip-auth)}
  .ctg-list{display:flex; flex-direction:column; gap:8px}
  .ctg-item{display:grid; grid-template-columns:38px 1fr; gap:12px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; cursor:pointer; transition:background .12s,border-color .12s}
  .ctg-item:hover{background:var(--band-a); border-color:var(--red)}
  .ctg-need{background:var(--miss-red-bg); color:var(--miss-red-line); border:1px solid var(--miss-red-line);
    font-weight:700; font-size:14px; text-align:center; border-radius:8px; padding:5px 0}
  .ctg-main{min-width:0}
  .ctg-title{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
  .ctg-name{font-weight:600; font-size:14.5px}
  .ctg-set{color:var(--muted); font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums;
    letter-spacing:.3px; background:var(--band-b); padding:1px 7px; border-radius:5px}
  .ctg-decks{display:block; color:var(--muted); font-size:12px; margin-top:3px;
    overflow:hidden; text-overflow:ellipsis}
  /* Stats */
  .st-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:8px}
  .st-tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 12px; text-align:center}
  .st-num{font-size:26px; font-weight:800; color:var(--red-dark); line-height:1.1; font-variant-numeric:tabular-nums}
  .st-num .st-sub{font-size:15px; color:var(--muted); font-weight:700}
  .st-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin-top:5px}
  .st-section{margin-top:22px}
  .st-h{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 10px}
  .st-bar{display:flex; height:16px; border-radius:8px; overflow:hidden; background:var(--band-b);
    box-shadow:inset 0 0 0 1px var(--line)}
  .st-bar.small{height:10px; border-radius:5px}
  .st-seg{height:100%}
  .st-seg.auth{background:var(--pip-auth)} .st-seg.wc{background:var(--pip-wc)}
  .st-seg.proxy{background:var(--pip-proxy)} .st-seg.miss{background:var(--pip-miss)}
  .st-legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:11px}
  .st-key{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink)}
  .st-key .pip{width:11px; height:11px}
  .st-formats{display:flex; flex-direction:column; gap:12px}
  .st-fmt-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:5px}
  .st-fmt-head b{font-size:14px} .st-fmt-head span{font-size:12px; color:var(--muted)}
  .st-tiers{display:flex; flex-wrap:wrap; gap:10px 20px}
  .st-tierkey{display:inline-flex; align-items:center; gap:7px; font-size:14px; color:var(--ink)}
  /* Tournament Log */
  .tl-card{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden}
  .tl-head{cursor:pointer; padding:14px 16px; list-style:none; display:flex; flex-direction:column; gap:4px}
  .tl-head::-webkit-details-marker{display:none}
  .tl-card[open] .tl-head{border-bottom:1px solid var(--band-b)}
  .tl-sum-main{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .tl-name{font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; color:var(--red-dark)}
  .tl-date{font-size:12.5px; color:var(--muted); font-weight:600; white-space:nowrap}
  .tl-sum-sub{font-size:12.5px; color:var(--muted)}
  .tl-sum-sub b{color:var(--ink); font-variant-numeric:tabular-nums}
  .tl-fmt{color:var(--ink); font-weight:600}
  .tl-body{padding:14px 16px 16px}
  .tl-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
  .tl-tile{background:var(--band-b); border-radius:10px; padding:11px 10px; text-align:center}
  .tl-tval{font-size:19px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
  .tl-tlabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; margin-top:4px}
  .tl-list summary{cursor:pointer; font-weight:700; font-size:13px; color:var(--red-dark); padding:4px 0}
  .tl-list pre{background:var(--band-b); border:1px solid var(--line); border-radius:10px; padding:14px; overflow-x:auto;
    font-size:12.5px; line-height:1.55; white-space:pre; margin:8px 0 0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink)}
  .tl-copy{margin-top:8px; border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-family:inherit; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer}
  .tl-copy:hover{border-color:var(--red); color:var(--red-dark)}
  .tl-copy.copied{background:var(--pip-auth); color:#fff; border-color:var(--pip-auth)}
  .tl-notes{font-size:13px; color:var(--ink); background:var(--band-a); border-radius:8px; padding:9px 12px; margin-top:12px}
  .tl-money{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--band-b)}
  .tl-mitem{display:flex; flex-direction:column; gap:3px}
  .tl-mitem span{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700}
  .tl-mitem b{font-size:16px; color:var(--ink); font-variant-numeric:tabular-nums}
  .controls{display:flex; flex-direction:column; gap:10px; margin-bottom:12px}
  .search{
    width:100%; padding:13px 16px; font-size:16px; border:1px solid var(--line);
    border-radius:13px; background:var(--card); color:var(--ink); outline:none;
    box-shadow:0 1px 2px var(--shadow); transition:box-shadow .15s,border-color .15s;
  }
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:var(--red); box-shadow:0 0 0 3px rgba(238,43,57,.15)}
  /* compact default (once a year/All is picked and decks are showing) */
  .filters{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    box-sizing:border-box; width:62px; flex:0 0 62px; text-align:center;
    padding:7px 0; border-radius:999px; border:1px solid var(--line);
    background:var(--chip-bg); color:var(--red-dark); font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap; user-select:none; font-variant-numeric:tabular-nums;
    transition:background .15s,color .15s,border-color .15s,transform .15s,box-shadow .15s;
    box-shadow:0 1px 2px var(--shadow);
  }
  .chip:hover{border-color:var(--red); transform:translateY(-1px)}
  .chip.active{background:var(--red); color:#fff; border-color:var(--red); box-shadow:0 3px 10px rgba(238,43,57,.35)}
  /* a year with no decks yet (e.g. 2011) is greyed until one is added */
  .chip.chip-empty{opacity:.5; color:var(--muted); box-shadow:none}
  .chip.chip-empty:hover{border-color:var(--line); transform:none}
  /* landing (no year picked yet): large, prominent 5-per-row tiles + only the filters */
  .controls.landing .filters{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px}
  .controls.landing .chip{width:auto; flex:none; padding:15px 4px; border-radius:13px; font-size:16px; font-weight:700}
  .controls.landing .chip.chip-all{grid-column:1 / -1}  /* "All" spans the bottom row */
  .controls.landing #q, .controls.landing #missingToggle{display:none}
  /* Turn 1 Rules button — landing only, styled like the per-year rules boxes */
  .t1-landing-btn{
    display:none; width:100%; padding:15px 16px; border:none; border-radius:13px; cursor:pointer;
    background:var(--rules-header); color:#fff; font-family:'Poppins',sans-serif; font-size:15px;
    font-weight:600; box-shadow:0 2px 10px var(--shadow); transition:filter .15s;
  }
  .controls.landing .t1-landing-btn{display:block}
  .t1-landing-btn:hover{filter:brightness(1.2)}
  .t1-landing-btn.active{box-shadow:0 0 0 2px var(--red)}
  /* aggregate turn-1 list: compact year tiles (5/row) that expand their rules */
  .t1-agg{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; align-items:start}
  .t1-tile{
    padding:15px 4px; border:1px solid var(--line); border-radius:13px; cursor:pointer;
    background:var(--rules-header); color:#fff; font-family:'Poppins',sans-serif;
    font-size:16px; font-weight:700; text-align:center; box-shadow:0 1px 2px var(--shadow);
    font-variant-numeric:tabular-nums; transition:filter .15s;
  }
  .t1-tile:hover{filter:brightness(1.25)}
  .t1-tile.active{box-shadow:0 0 0 2px var(--red)}
  .t1-tile-panel{
    display:none; grid-column:1 / -1; padding:14px 16px; border:1px solid var(--line);
    border-radius:13px; background:var(--rules-panel); color:var(--ink);
  }
  .t1-tile-panel.open{display:block}
  /* landing intro / how-to blurb (shown when no year is selected) */
  .home-blurb{max-width:640px; margin:6px auto 0; color:var(--ink); line-height:1.55; font-size:14.5px; text-align:left}
  .home-blurb .home-title{font-family:'Poppins',sans-serif; font-size:19px; font-weight:600; margin:32px 0 14px; color:var(--ink)}
  .home-blurb .home-title:first-child{margin-top:0}
  .home-blurb .blurb-a,
  .home-blurb .blurb-link{color:var(--red-dark); font-weight:600; text-decoration:underline; cursor:pointer}
  .home-blurb .blurb-link{text-decoration-style:dotted; text-underline-offset:2px}
  .home-blurb .blurb-a:hover,
  .home-blurb .blurb-link:hover{color:var(--red)}
  .home-blurb p{margin:0 0 12px}
  .home-blurb h3{font-family:'Poppins',sans-serif; font-size:15px; font-weight:600; margin:20px 0 8px}
  .home-blurb ul{margin:0; padding-left:20px}
  .home-blurb li{margin:6px 0}
  .home-blurb .fav-star{width:16px; height:16px; vertical-align:-3px}
  .home-blurb .tier-badge{vertical-align:1px}
  .stats{font-size:13px; color:var(--muted); margin:2px 2px 14px; font-weight:500}
  .turn1-box{
    background:var(--rules-panel); border:1px solid var(--line); border-radius:16px;
    margin-bottom:16px; overflow:hidden; box-shadow:0 2px 10px var(--shadow);
  }
  .turn1-box[hidden]{display:none}
  .t1-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; cursor:pointer; color:#fff; background:var(--rules-header); border:none;
    font-family:'Poppins',sans-serif; font-size:14.5px; font-weight:600; text-align:left;
  }
  .t1-toggle:hover{filter:brightness(1.2)}
  .t1-arrow{transition:transform .2s; font-size:12px}
  .t1-toggle.active .t1-arrow{transform:rotate(90deg)}
  .t1-panel{display:none; padding:16px}
  .t1-panel.open{display:block}
  .t1-flip{font-size:14px; margin-bottom:10px}
  .t1-flip strong{font-family:'Poppins',sans-serif}
  .t1-sub{font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .t1-rule{font-size:14px; padding:6px 0; display:flex; align-items:center; gap:8px}
  /* matchup generator */
  .matchup-controls{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px}
  .matchup-select{
    flex:1 1 200px; padding:12px 14px; font-size:15px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); color:var(--ink); font-family:inherit;
    box-shadow:0 1px 2px var(--shadow);
  }
  .matchup-btn{
    flex:0 0 auto; padding:12px 20px; border:none; border-radius:12px; cursor:pointer;
    background:var(--red); color:#fff; font-family:'Poppins',sans-serif; font-size:14.5px;
    font-weight:600; box-shadow:0 3px 10px rgba(238,43,57,.3); transition:transform .15s,box-shadow .15s;
  }
  .matchup-btn:hover{transform:translateY(-1px); box-shadow:0 5px 16px rgba(238,43,57,.4)}
  .matchup-empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:15px}
  .matchup-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:28px 20px; box-shadow:0 2px 10px var(--shadow); text-align:center;
  }
  .matchup-format{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
    color:var(--muted); background:var(--band-b); padding:4px 12px; border-radius:999px; margin-bottom:20px;
  }
  .matchup-vs{display:flex; align-items:center; justify-content:center; gap:18px}
  .matchup-deck{
    flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--band-a); cursor:pointer;
    border-radius:14px; padding:18px 14px; font-family:'Poppins',sans-serif; font-size:16px;
    font-weight:600; color:var(--ink); transition:transform .15s,box-shadow .15s,border-color .15s;
  }
  .matchup-deck:hover{transform:translateY(-2px); box-shadow:0 6px 16px var(--shadow); border-color:var(--red)}
  .matchup-vs-label{flex:0 0 auto; font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; color:var(--red)}
  .matchup-hint{margin-top:16px; font-size:12.5px; color:var(--muted)}
  /* card collection (aggregate) tab */
  .cc-controls-row{display:flex; flex-wrap:wrap; gap:10px}
  .cc-select{
    flex:1 1 160px; padding:12px 14px; font-size:15px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); color:var(--ink); font-family:inherit;
    box-shadow:0 1px 2px var(--shadow);
  }
  .cc-export-btn{
    flex:0 0 auto; padding:12px 18px; border:none; border-radius:12px; cursor:pointer;
    background:var(--red); color:#fff; font-family:'Poppins',sans-serif; font-size:14px;
    font-weight:600; box-shadow:0 3px 10px rgba(238,43,57,.3); transition:transform .15s,box-shadow .15s;
  }
  .cc-export-btn:hover{transform:translateY(-1px); box-shadow:0 5px 16px rgba(238,43,57,.4)}
  .inv-list{display:flex; flex-direction:column; gap:8px}
  .inv-item{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; cursor:pointer; transition:background .12s,border-color .12s}
  .inv-item:hover{background:var(--band-a); border-color:var(--red)}
  .inv-item:hover .inv-name{color:var(--red-dark)}
  /* no image available for this card -> not clickable-looking */
  .inv-item.inv-noimg{cursor:default}
  .inv-item.inv-noimg:hover{background:var(--card); border-color:var(--line)}
  .inv-item.inv-noimg:hover .inv-name{color:inherit}
  .inv-main{min-width:0}
  .inv-title{display:flex; align-items:baseline; gap:9px}
  .inv-name{font-weight:600; font-size:14.5px; transition:color .12s}
  .inv-qty{background:var(--cnt-bg); color:var(--red-dark); font-weight:700; font-size:11.5px;
    padding:1px 8px; border-radius:999px; font-variant-numeric:tabular-nums}
  /* verification state: ✓ = counts confirmed with Vig, • = still to check */
  .inv-ok{color:var(--pip-auth); font-weight:800; font-size:12.5px}
  .inv-todo{color:var(--muted); opacity:.55; font-size:13px; line-height:1}
  /* one row per print; each line under it is a print type + the deck holding it */
  .inv-vars{display:flex; flex-direction:column; gap:2px; margin-top:4px; color:var(--muted); font-size:11.5px}
  .inv-var{display:flex; align-items:baseline; gap:5px; flex-wrap:wrap}
  .inv-var .inv-src{margin-left:auto; padding-left:10px}
  .inv-set-unknown{font-style:italic; opacity:.75}
  .inv-src{color:var(--muted); opacity:.75; font-size:10.5px}
  .inv-src-deck{color:var(--steel); opacity:1}
  .inv-var b{color:var(--ink); font-variant-numeric:tabular-nums}
  .inv-set{background:var(--band-b); border-radius:4px; padding:0 5px; font-variant-numeric:tabular-nums}
  .inv-decks{display:block; color:var(--muted); font-size:12px; margin-top:3px; line-height:1.45}
  .inv-spare{color:var(--miss-orange-line); font-weight:600}
  /* game log */
  .gl-filters{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px}
  .gl-filters .cc-select{flex:1 1 200px}
  .gl-summary{font-size:13.5px; color:var(--muted); margin:2px 2px 14px; font-weight:500; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center}
  .gl-summary b{color:var(--ink)}
  .gl-rec-w{color:#1f9d55; font-weight:700}
  .gl-rec-l{color:var(--miss-red-line); font-weight:700}
  .gl-rec-t{color:var(--muted); font-weight:700}
  .gl-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px var(--shadow); background:var(--card)}
  .gl-table{border-collapse:collapse; width:100%; font-size:13.5px}
  .gl-table th,.gl-table td{padding:10px 13px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap}
  .gl-table thead th{background:var(--red); color:#fff; font-family:'Poppins',sans-serif; font-weight:600; font-size:12.5px}
  .gl-table tbody tr:last-child td{border-bottom:none}
  .gl-table tbody tr:hover{background:var(--band-a)}
  .gl-table td.gl-notes{white-space:normal; min-width:140px; color:var(--muted)}
  .gl-res{display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700}
  .gl-res.Win{background:rgba(31,157,85,.16); color:#1f9d55}
  .gl-res.Loss{background:var(--miss-red-bg); color:var(--miss-red-line)}
  .gl-res.Tie{background:var(--band-b); color:var(--muted)}
  .gl-del{background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px; line-height:1}
  .gl-del:hover{color:var(--miss-red-line)}
  .gl-empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:15px}
  .deck{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    margin-bottom:16px; overflow:hidden; box-shadow:0 2px 10px var(--shadow);
    transition:box-shadow .2s,transform .2s;
  }
  .deck:hover{box-shadow:0 6px 20px var(--shadow); transform:translateY(-1px)}
  .deck-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; cursor:pointer; color:#fff;
    background:var(--red);
    border-bottom:3px solid var(--pokeball-ink);
  }
  .deck-head .title{font-family:'Poppins',sans-serif; font-weight:600; font-size:15.5px; letter-spacing:.1px;
    display:flex; align-items:center; min-width:0; flex:1 1 auto}
  /* the name truncates if ever too long, so the star/tier badge and count pill
     never wrap to a second line */
  .deck-head .dname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .deck-head .tier-badge{flex:0 0 auto}
  /* "favourite deck of the year" star (marked per deck in FAVOURITES) */
  .fav-star{width:19px; height:19px; vertical-align:-4px; margin-left:7px; flex:0 0 auto}
  /* minimalist per-deck tier badge (marked in TIERS) */
  .tier-badge{display:inline-flex; align-items:center; justify-content:center;
    min-width:17px; height:17px; padding:0 4px; margin-left:8px; border-radius:5px;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:10.5px; line-height:1;
    letter-spacing:.2px; color:#2f2a26; vertical-align:2px; flex:0 0 auto}
  .tier-badge.tier-S{background:#FFD43B}
  .tier-badge.tier-A{background:#CED4DA}
  .tier-badge.tier-B{background:#E8B48A}
  .deck-head .meta{font-size:12px; opacity:.9; font-weight:500; display:flex; align-items:center; gap:8px; flex:0 0 auto}
  .deck-head .arrow{transition:transform .2s; font-size:12px; opacity:.95}
  .deck.collapsed .arrow{transform:rotate(-90deg)}
  .deck.collapsed .cards{display:none}
  .deck.collapsed .guidebar{display:none}
  .deck.collapsed .guide-panel{display:none}
  .deck.collapsed .deck-head{border-bottom:none}
  .deck.guide-open .cards{display:none}
  .cards{padding:4px 0}
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 5px; font-size:11px; font-weight:700; letter-spacing:.8px;
    text-transform:uppercase; color:var(--muted);
  }
  .section-total{
    background:var(--band-b); color:var(--muted); font-weight:700; font-size:11px;
    padding:2px 9px; border-radius:999px;
  }
  .row{
    display:grid; grid-template-columns:34px 1fr auto auto; gap:10px; align-items:center;
    padding:10px 16px; border-top:1px solid var(--band-b); font-size:14px; cursor:pointer;
    transition:background .12s;
  }
  .row:hover{background:var(--band-a)}
  .row:first-child{border-top:none}
  .row .cnt{
    background:var(--cnt-bg); color:var(--red-dark); font-weight:700; text-align:center;
    border-radius:7px; padding:3px 0; font-size:13px;
  }
  .row .nm{font-weight:500}
  .row .st{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; text-align:right; min-width:44px}
  /* per-copy print-type pips (expanded deck view only) */
  .row .prints{display:inline-flex; gap:3px; justify-content:flex-end; align-items:center}
  .pip{width:10px; height:10px; border-radius:2.5px; flex:0 0 auto}
  .pip.auth{background:var(--pip-auth)} .pip.wc{background:var(--pip-wc)}
  .pip.proxy{background:var(--pip-proxy)}
  .pip.miss{background:transparent; border:1.5px dashed var(--pip-miss)}
  .prints .single{display:inline-flex; align-items:center; gap:6px}
  .prints .cn{font-size:12px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
  .deck-legend{display:flex; gap:12px; flex-wrap:nowrap; align-items:center;
    padding:9px 16px; border-bottom:1px solid var(--band-b); background:var(--band-b)}
  .deck-legend .lg{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); white-space:nowrap}
  .deck-legend .lg .pip{width:9px; height:9px; flex:0 0 auto}
  .copy-deck{margin-left:auto; display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; padding:0; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    transition:background .12s, color .12s, border-color .12s}
  .copy-deck:hover{color:var(--red-dark); border-color:var(--red); background:var(--band-a)}
  .copy-deck .ic-done{display:none}
  .copy-deck.copied{color:#fff; background:var(--pip-auth); border-color:var(--pip-auth)}
  .copy-deck.copied .ic-copy{display:none}
  .copy-deck.copied .ic-done{display:block}
  /* Missing-card highlighting: orange = own some but short, red = own none. */
  .row.miss-some{background:var(--miss-orange-bg); box-shadow:inset 3px 0 0 var(--miss-orange-line)}
  .row.miss-all{background:var(--miss-red-bg); box-shadow:inset 3px 0 0 var(--miss-red-line)}
  .row.miss-some:hover{background:var(--miss-orange-bg); filter:brightness(1.05)}
  .row.miss-all:hover{background:var(--miss-red-bg); filter:brightness(1.05)}
  .miss-badge{
    display:inline-block; margin-left:7px; font-size:10.5px; font-weight:700; color:#fff;
    padding:1px 7px; border-radius:6px; vertical-align:middle; letter-spacing:.2px; white-space:nowrap;
  }
  .row.miss-some .miss-badge{background:var(--miss-orange-line)}
  .row.miss-all .miss-badge{background:var(--miss-red-line)}
  /* a deck with missing cards flags it by tinting its count pill the Missing-filter
     shade (header box + name stay as normal); replaces the old inline yellow badge */
  .deck-head.has-missing .count-badge{background:var(--miss-orange-line); color:#fff}
  .count-badge.miss{background:rgba(255,255,255,.24); color:#ffe1b3; font-weight:700}
  .miss-filter{
    margin-top:8px; align-self:flex-start; display:inline-flex; align-items:center; gap:6px; padding:7px 15px;
    border-radius:999px; border:1px solid var(--miss-orange-line); background:var(--chip-bg);
    color:var(--miss-orange-line); font-family:inherit; font-size:13px; font-weight:600;
    cursor:pointer; user-select:none; box-shadow:0 1px 2px var(--shadow);
    transition:background .15s,color .15s,transform .15s;
  }
  .miss-filter:hover{transform:translateY(-1px)}
  .miss-filter.active{background:var(--miss-orange-line); color:#fff}
  mark{background:var(--mark-bg); color:var(--mark-ink); border-radius:3px; padding:0 1px}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:15px}
  /* guide expander */
  .guidebar{border-top:1px solid var(--band-b); background:var(--band-a)}
  .guide-btn{
    width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
    padding:12px 16px; font-size:13px; font-weight:700; color:var(--red-dark);
    font-family:inherit; letter-spacing:.1px; transition:background .12s;
  }
  .guide-btn:hover{background:var(--cnt-bg)}
  .guide-btn.active{background:var(--cnt-bg)}
  .guide-panel{display:none; padding:2px 20px 20px; font-size:13.5px; line-height:1.6; color:var(--ink)}
  .guide-panel.open{display:block; border-top:1px solid var(--band-b)}
  .guide-panel h1{font-family:'Poppins',sans-serif; font-size:17px; margin:16px 0 5px; color:var(--red-dark); font-weight:700}
  .guide-panel h2{font-family:'Poppins',sans-serif; font-size:14px; margin:18px 0 5px; color:var(--charcoal); border-bottom:1px solid var(--line); padding-bottom:4px; font-weight:600}
  .guide-panel p{margin:6px 0}
  .guide-panel ul,.guide-panel ol{margin:6px 0; padding-left:20px}
  .guide-panel li{margin:3px 0}
  .guide-panel code{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:0 3px; font-size:12px}
  .guide-panel em{color:var(--muted)}
  .guide-panel blockquote{margin:8px 0; padding:6px 12px; border-left:3px solid var(--red); background:var(--card); color:var(--charcoal)}
  .guide-panel hr{border:none; border-top:1px solid var(--line); margin:12px 0}
  .guide-panel strong{color:var(--charcoal-dark)}
  /* Guides may include a small reference table (e.g. Spiritomb's damage-per-counter
     row). Wide ones scroll inside their own box rather than stretching the panel. */
  .guide-panel .table-wrap{overflow-x:auto; margin:10px 0}
  .guide-panel table{border-collapse:collapse; font-size:12.5px}
  .guide-panel th,.guide-panel td{border:1px solid var(--line); padding:4px 9px; text-align:center; white-space:nowrap}
  .guide-panel th{background:var(--band-a); color:var(--charcoal-dark); font-weight:600}
  .count-badge{background:rgba(255,255,255,.24); padding:2px 8px; border-radius:999px; font-size:11px; white-space:nowrap}
  /* phones: nudge the deck title down + tighten padding so the longest names
     (e.g. Cynthia's Garchomp (2026)) fit on one line without truncating */
  @media (max-width:480px){
    .deck-head{padding:13px 12px}
    .deck-head .title{font-size:13.5px}
    .deck-head .fav-star{width:16px; height:16px; margin-left:5px}
    .deck-head .tier-badge{margin-left:5px}
  }
  .loading{text-align:center; color:var(--muted); padding:40px 20px; font-size:15px}
  /* card image modal */
  .modal-overlay{
    position:fixed; inset:0; background:var(--overlay); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay[hidden]{display:none}
  .modal-box{
    position:relative; max-width:480px; width:100%; background:var(--card);
    border-radius:18px; padding:20px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  @media (min-width:640px){
    .modal-box{max-width:560px; padding:24px}
  }
  .modal-close{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    border:none; background:var(--band-b); color:var(--ink); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
    box-shadow:0 1px 3px var(--shadow);
  }
  .modal-body img{max-width:100%; width:100%; height:auto; border-radius:12px; display:block; margin:0 auto; box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .modal-noimg{padding:60px 10px; color:var(--muted); font-size:14px}
  .modal-caption{margin-top:14px; font-size:13.5px; color:var(--muted); font-weight:600}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <clipPath id="pbTop"><path d="M4 50A46 46 0 0 1 96 50Z"/></clipPath>
        <clipPath id="pbBottom"><path d="M4 50A46 46 0 0 0 96 50Z"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="46" fill="#fff" stroke="#39424B" stroke-width="6"/>
      <path d="M4 50A46 46 0 0 1 96 50Z" fill="#F0504A"/>
      <g clip-path="url(#pbTop)"><ellipse cx="80" cy="22" rx="28" ry="32" fill="#D8413C"/></g>
      <g clip-path="url(#pbBottom)"><ellipse cx="80" cy="78" rx="30" ry="26" fill="#E4E6E9"/></g>
      <rect x="4" y="44" width="92" height="12" fill="#39424B"/>
      <circle cx="50" cy="50" r="15" fill="#fff"/>
      <circle cx="50" cy="50" r="13" fill="#39424B"/>
      <circle cx="50" cy="50" r="8" fill="#fff"/>
    </svg>
    <div>
      <h1>Vig's Pokémon Collection</h1>
      <div id="tagline" class="sub">Competitive decks</div>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>
<div class="seam"></div>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="collection" type="button">Old Format Decks</button>
    <button class="tab-btn" data-tab="tools" type="button" hidden>Tools</button>
  </div>

  <div id="collectionTab" class="tab-panel active">
    <div class="controls">
      <input id="q" class="search" type="search" placeholder="Search cards, decks, sets…" autocomplete="off">
      <div id="years" class="filters"></div>
      <button id="missingToggle" class="miss-filter" type="button">⚠︎ Missing</button>
      <button id="t1LandingBtn" class="t1-landing-btn" type="button">Turn 1 Rules</button>
    </div>
    <div id="stats" class="stats"></div>
    <div id="turn1Box" class="turn1-box" hidden></div>
    <div id="list"><div class="loading">Loading collection…</div></div>
  </div>

  <div id="toolsTab" class="tab-panel">
    <div class="subtabs">
      <button class="subtab-btn active" data-subtab="inventory" type="button">Inventory</button>
      <button class="subtab-btn" data-subtab="cardsToGet" type="button">Cards to Get</button>
      <button class="subtab-btn" data-subtab="tournamentLog" type="button">Tournament Log</button>
      <button class="subtab-btn" data-subtab="stats" type="button">Stats</button>
      <!-- Parked, not deleted: drop the `hidden` attribute to switch either
           back on. Their panels stay in the DOM so their code keeps working. -->
      <button class="subtab-btn" data-subtab="matchup" type="button" hidden>Matchup Generator</button>
      <button class="subtab-btn" data-subtab="gameLog" type="button" hidden>Game Log</button>
    </div>

  <div id="inventoryTab" class="subtab-panel active">
    <div class="controls">
      <input id="inv-q" class="search" type="search" placeholder="Search your cards…" autocomplete="off">
      <div class="cc-controls-row">
        <select id="inv-filter" class="cc-select" aria-label="Filter cards">
          <option value="ALL">All cards</option>
          <option value="INDECK">In a deck</option>
          <option value="SPARE">Spare only</option>
          <option value="UNVERIFIED">Not verified yet</option>
          <option value="VERIFIED">Verified</option>
          <option value="Pokemon">Pokémon</option>
          <option value="Trainer">Trainers</option>
          <option value="Energy">Energy</option>
        </select>
      </div>
    </div>
    <div id="inv-stats" class="stats"></div>
    <div id="inv-list" class="inv-list"></div>
  </div>

  <div id="cardsToGetTab" class="subtab-panel">
    <div class="ctg-head">
      <div id="ctg-summary" class="stats"></div>
      <button id="ctg-copy" class="ctg-copy-btn" type="button">📋 Copy list</button>
    </div>
    <div id="ctg-list" class="ctg-list"></div>
  </div>

  <div id="statsTab" class="subtab-panel">
    <div id="stats-content"></div>
  </div>

  <div id="tournamentLogTab" class="subtab-panel">
    <div class="gl-filters">
      <select id="tl-deck" class="cc-select" aria-label="Filter by deck"></select>
      <select id="tl-year" class="cc-select" aria-label="Filter by year"></select>
    </div>
    <div id="tl-summary" class="stats"></div>
    <div id="tl-content"></div>
  </div>

  <div id="matchupTab" class="subtab-panel">
    <div class="matchup-controls">
      <select id="matchupFormat" class="matchup-select"></select>
      <button id="matchupBtn" class="matchup-btn" type="button">🎲 Randomize Matchup</button>
    </div>
    <div id="matchupResult"></div>
  </div>

  <div id="gameLogTab" class="subtab-panel">
    <div class="gl-filters">
      <select id="gl-player" class="cc-select" aria-label="Filter by opponent"></select>
      <select id="gl-year" class="cc-select" aria-label="Filter by year"></select>
    </div>
    <div id="gl-summary" class="gl-summary"></div>
    <div id="gl-table-wrap"></div>
  </div>
  </div>
</div>

<div id="imgModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <button class="modal-close" type="button" aria-label="Close">&times;</button>
    <div class="modal-body"></div>
  </div>
</div>

<script>
/* ---------- theme ---------- */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
}
(function initTheme(){
  const saved = localStorage.getItem('theme');
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (systemDark ? 'dark' : 'light'));
})();
themeBtn.onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
};

/* ---------- card image modal ---------- */
const modal = document.getElementById('imgModal');
const modalBody = modal.querySelector('.modal-body');
function openCardModal(card){
  modalBody.innerHTML = '';
  if(card.image){
    const img = document.createElement('img');
    img.src = card.image;
    img.alt = card.name;
    modalBody.appendChild(img);
  } else {
    const p = document.createElement('div');
    p.className = 'modal-noimg';
    p.textContent = 'No image on file for this print.';
    modalBody.appendChild(p);
  }
  const cap = document.createElement('div');
  cap.className = 'modal-caption';
  cap.textContent = card.set ? `${card.name} · ${card.set}` : card.name;
  modalBody.appendChild(cap);
  modal.hidden = false;
}
// Generic image popup (reuses the card modal) for the About-me photos.
function openImageModal(src, caption){
  modalBody.innerHTML = '';
  const img = document.createElement('img');
  img.src = src; img.alt = caption || '';
  modalBody.appendChild(img);
  if(caption){
    const cap = document.createElement('div');
    cap.className = 'modal-caption';
    cap.textContent = caption;
    modalBody.appendChild(cap);
  }
  modal.hidden = false;
}
modal.addEventListener('click', e => { if(e.target === modal) modal.hidden = true; });
modal.querySelector('.modal-close').onclick = () => modal.hidden = true;
document.addEventListener('keydown', e => { if(e.key === 'Escape') modal.hidden = true; });

/* ---------- data + render ---------- */

function renderTurn1Box(){
  const box = document.getElementById('turn1Box');
  const data = TURN1_RULES[activeYear];
  if(activeYear === 'ALL' || !data){
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  box.hidden = false;
  const allowedLabels = data.rules.filter(r => r.allowed).map(r => r.label);
  const deniedLabels = data.rules.filter(r => !r.allowed).map(r => r.label);
  const rulesHtml = [
    allowedLabels.length ? `<div class="t1-rule">✅ ${esc(allowedLabels.join('/'))}</div>` : '',
    deniedLabels.length ? `<div class="t1-rule">❌ ${esc(deniedLabels.join('/'))}</div>` : '',
  ].join('');
  box.innerHTML = `
    <button type="button" class="t1-toggle">
      <span>📜 Turn 1 Rules — ${esc(activeYear)}</span>
      <span class="t1-arrow">▶</span>
    </button>
    <div class="t1-panel">
      <div class="t1-flip"><strong>Flip:</strong> ${esc(data.flip)}</div>
      <div class="t1-sub">Player going first:</div>
      ${rulesHtml}
    </div>`;
  const btn = box.querySelector('.t1-toggle');
  const panel = box.querySelector('.t1-panel');
  btn.onclick = () => {
    const isOpen = panel.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
  };
}

// The landing "Turn 1 Rules" button lists every year (each row collapsed
// until clicked). Iterates the rule years, so years without decks (2011) show.
function renderT1AggregateHtml(){
  const years = Object.keys(TURN1_RULES)
    .filter(k => k !== '_comment')
    .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
  const tiles = years
    .filter(y => TURN1_RULES[y])
    .map(y => `<button type="button" class="t1-tile" data-year="${esc(y)}">${esc(y)}</button>`)
    .join('');
  return `<div class="t1-agg">${tiles}</div>`;
}
// One shared rules panel, inserted after the *whole row* of the clicked tile so
// the other tiles in that row don't reflow. Grid is a fixed 5 columns.
function wireT1Aggregate(){
  const grid = document.querySelector('#list .t1-agg');
  if(!grid) return;
  const COLS = 5;
  const tiles = [...grid.querySelectorAll('.t1-tile')];
  let panel = null, active = null;
  const close = () => {
    if(panel){ panel.remove(); panel = null; }
    if(active){ active.classList.remove('active'); active = null; }
  };
  tiles.forEach((tile, i) => {
    tile.onclick = () => {
      if(active === tile){ close(); return; }
      close();
      active = tile; tile.classList.add('active');
      const d = TURN1_RULES[tile.dataset.year];
      const allowed = d.rules.filter(r => r.allowed).map(r => r.label);
      const denied = d.rules.filter(r => !r.allowed).map(r => r.label);
      panel = document.createElement('div');
      panel.className = 't1-tile-panel open';
      panel.innerHTML = `<div class="t1-flip"><strong>Flip:</strong> ${esc(d.flip)}</div>
        <div class="t1-sub">Player going first:</div>
        ${allowed.length ? `<div class="t1-rule">✅ ${esc(allowed.join('/'))}</div>` : ''}
        ${denied.length ? `<div class="t1-rule">❌ ${esc(denied.join('/'))}</div>` : ''}`;
      const rowEnd = Math.min(i - (i % COLS) + COLS - 1, tiles.length - 1);
      tiles[rowEnd].after(panel);
    };
  });
}

// Basic energy carries no stored set; export it as the current basic-energy set
// (MEE) with the standard type numbering, which is how PTCGL exports read.
const BASIC_ENERGY_NO = {
  "Grass Energy":1, "Fire Energy":2, "Water Energy":3, "Lightning Energy":4,
  "Psychic Energy":5, "Fighting Energy":6, "Darkness Energy":7, "Metal Energy":8,
  "Fairy Energy":9,
};
function setCodeFromImage(url){
  if(!url) return '';
  const m = url.match(/images\.pokemontcg\.io\/([^/]+)\//) || url.match(/scrydex\.com\/pokemon\/([a-z0-9]+)-\d/i);
  return m ? (SET_CODES[m[1]] || '') : '';
}
// Build the standard "Section: total" + "count Name CODE number" text.
function deckListText(deckName){
  const rows = CARDS.filter(c => c.deck === deckName);
  const out = [];
  for(const [key, label] of [['Pokemon','Pokémon'], ['Trainer','Trainer'], ['Energy','Energy']]){
    const sec = rows.filter(c => c.category === key);
    if(!sec.length) continue;
    const total = sec.reduce((s,c)=> s + (Number(c.count)||0), 0);
    out.push(`${label}: ${total}`);
    for(const c of sec){
      if(isBasicEnergy(c) && BASIC_ENERGY_NO[c.name]){
        out.push(`${c.count} ${c.name} MEE ${BASIC_ENERGY_NO[c.name]}`);
      } else {
        const code = setCodeFromImage(c.image);
        const num = String(c.set || '').split('/')[0];
        out.push(code && num ? `${c.count} ${c.name} ${code} ${num}` : `${c.count} ${c.name}`);
      }
    }
    out.push('');
  }
  return out.join('\n').trim();
}
async function copyDeckList(deckName, btn){
  const text = deckListText(deckName);
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(_){}
    ta.remove();
  }
  btn.classList.add('copied');
  clearTimeout(btn._t);
  btn._t = setTimeout(() => btn.classList.remove('copied'), 1500);
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return t;
  return t.slice(0,i) + '<mark>' + t.slice(i, i+q.length) + '</mark>' + t.slice(i+q.length);
}

function matches(c, q){
  if(!q) return true;
  q = q.toLowerCase();
  return c.name.toLowerCase().includes(q)
      || c.deck.toLowerCase().includes(q)
      || String(c.set).toLowerCase().includes(q);
}

// Print-type model: prints{authentic,wc,proxy} are the copies owned by print,
// and Missing is derived (count minus what you own) so the Missing filter and
// the "N cards" counts still work without a separate stored field.
function printsOf(c){
  const p = c.prints || {};
  return {
    authentic: Number(p.authentic) || 0,
    wc:        Number(p.wc)        || 0,
    proxy:     Number(p.proxy)     || 0,
  };
}
function missingOf(c){
  const count = Number(c.count) || 0;
  const {authentic, wc, proxy} = printsOf(c);
  return Math.max(0, count - authentic - wc - proxy);
}
// Basic energy is stored with an empty set and is always a single print type,
// so it collapses to "count + one pip" per bucket instead of a per-copy strip.
function isBasicEnergy(c){
  return c.category === 'Energy' && (!c.set || c.set === '');
}
const PIP_ORDER = [['authentic','auth'], ['wc','wc'], ['proxy','proxy'], ['missing','miss']];
function printPipsHtml(c){
  const {authentic, wc, proxy} = printsOf(c);
  const buckets = {authentic, wc, proxy, missing: missingOf(c)};
  if(isBasicEnergy(c)){
    // count + single pip per non-empty bucket (usually just one)
    return PIP_ORDER
      .filter(([k]) => buckets[k] > 0)
      .map(([k, cls]) => `<span class="single"><span class="cn">${buckets[k]}</span><span class="pip ${cls}"></span></span>`)
      .join('');
  }
  // one pip per copy, ordered Authentic -> WC -> Proxy -> Missing
  return PIP_ORDER
    .map(([k, cls]) => `<span class="pip ${cls}"></span>`.repeat(buckets[k]))
    .join('');
}
function makeRow(c, query){
  const r = document.createElement('div');
  r.className = 'row';
  r.innerHTML = `<span class="cnt">${esc(c.count)}</span>
    <span class="nm">${hl(c.name, query)}</span>
    <span class="prints">${printPipsHtml(c)}</span>
    <span class="st">${hl(c.set, query)}</span>`;
  r.onclick = () => openCardModal(c);
  return r;
}

function render(){
  if(activeYear === null){   // landing: no decks yet, just the year filters
    document.getElementById('stats').textContent = '';
    document.getElementById('list').innerHTML = showT1
      ? renderT1AggregateHtml()
      : renderHomeBlurbHtml();
    if(showT1) wireT1Aggregate(); else wireHomeBlurb();
    const tb = document.getElementById('t1LandingBtn');
    if(tb) tb.classList.toggle('active', showT1);
    return;
  }
  let rows = CARDS;
  if(activeYear !== 'ALL') rows = rows.filter(c => c.year === activeYear);
  if(query) rows = rows.filter(c => matches(c, query));
  // The Missing filter stacks with the year filter: keep only cards the user
  // is short on (missing > 0). Decks with none then drop out entirely.
  if(missingOnly) rows = rows.filter(c => missingOf(c) > 0);

  const groups = new Map();
  for(const c of rows){
    if(!groups.has(c.deck)) groups.set(c.deck, []);
    groups.get(c.deck).push(c);
  }

  // Decks are always listed alphabetically (case-insensitive), so any deck
  // added later slots into place automatically without touching cards.json's
  // row order. On "All years" the years stay in chronological order (the site
  // is organised by year) and the alphabetical sort applies within each year;
  // filtering to one year makes the whole list alphabetical. deckYear() reads
  // the year off the group's first card rather than parsing the name.
  const deckYear = deck => groups.get(deck)[0].year;
  const sortedDecks = [...groups.keys()].sort((a, b) =>
    (YEARS.indexOf(deckYear(a)) - YEARS.indexOf(deckYear(b))) ||
    a.localeCompare(b, undefined, {sensitivity: 'base'}));

  const list = document.getElementById('list');
  const stats = document.getElementById('stats');
  list.innerHTML = '';

  if(groups.size === 0){
    const where = activeYear !== 'ALL' ? ` in ${esc(activeYear)}` : '';
    list.innerHTML = missingOnly
      ? `<div class="empty">No missing cards${where} — you have everything you need. 🎉</div>`
      : (!query && activeYear !== 'ALL')
        ? `<div class="empty">No decks logged for ${esc(activeYear)} yet.</div>`
        : '<div class="empty">No matches. Try a different search or year.</div>';
    stats.textContent = '';
    return;
  }

  let totalCards = 0;   // card lines (rows)
  let totalQty = 0;     // actual cards, summing each row's count (60 per deck)
  let totalMissing = 0; // copies the user is short on, across shown rows
  for(const arr of groups.values()){
    totalCards += arr.length;
    for(const c of arr){
      totalQty += (Number(c.count) || 0);
      totalMissing += missingOf(c);
    }
  }
  stats.textContent = missingOnly
    ? `${groups.size} deck${groups.size>1?'s':''} · ${totalCards} card${totalCards!==1?'s':''} missing · ${totalMissing} cop${totalMissing!==1?'ies':'y'} to find`
    : `${groups.size} deck${groups.size>1?'s':''} · ${totalCards} unique card${totalCards>1?'s':''} · ${totalQty} total cards`;

  // Auto-expand decks when a filter is narrowing the view (search or Missing).
  const collapsed = !query && !missingOnly;

  for(const deck of sortedDecks){
    const arr = groups.get(deck);
    const d = document.createElement('div');
    d.className = 'deck' + (collapsed ? ' collapsed' : '');
    const total = arr.reduce((s,c)=> s + (Number(c.count)||0), 0);
    const deckMissing = arr.reduce((s,c)=> s + missingOf(c), 0);
    const head = document.createElement('div');
    head.className = 'deck-head';
    // Under the Missing filter the badge shows how many copies are short;
    // otherwise the count of cards actually owned (deck size minus any missing),
    // and the pill is tinted (.has-missing) so a short deck stands out.
    const metaHtml = missingOnly
      ? `<span class="count-badge miss">${deckMissing} missing</span>`
      : `<span class="count-badge">${total - deckMissing} cards</span>`;
    if(deckMissing > 0) head.classList.add('has-missing');
    head.innerHTML = `<span class="title"><span class="dname">${hl(deck, query)}</span>${FAVOURITES.has(deck) ? FAV_STAR : ''}${TIERS[deck] ? tierBadge(TIERS[deck]) : ''}</span>
      <span class="meta">${metaHtml} <span class="arrow">▼</span></span>`;
    head.onclick = () => d.classList.toggle('collapsed');
    d.appendChild(head);

    const guideHtml = GUIDES[slug(deck)];
    if(guideHtml){
      const bar = document.createElement('div');
      bar.className = 'guidebar';
      const btn = document.createElement('button');
      btn.className = 'guide-btn';
      btn.type = 'button';
      btn.textContent = '📖 See Guide';
      bar.appendChild(btn);
      const panel = document.createElement('div');
      panel.className = 'guide-panel';
      panel.innerHTML = guideHtml;
      // Markdown emits a bare <table>; wrap it so a wide one scrolls inside its
      // own box instead of stretching the deck card and the page with it.
      panel.querySelectorAll('table').forEach(t => {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        t.replaceWith(wrap);
        wrap.appendChild(t);
      });
      btn.onclick = (e) => {
        e.stopPropagation();
        const isOpen = panel.classList.toggle('open');
        d.classList.toggle('guide-open', isOpen);
        btn.classList.toggle('active', isOpen);
        btn.textContent = isOpen ? '✕ Close Guide' : '📖 See Guide';
      };
      d.appendChild(bar);
      d.appendChild(panel);
    }

    const cw = document.createElement('div');
    cw.className = 'cards';
    // print-type key + copy button, shown only inside the expanded card list
    const legend = document.createElement('div');
    legend.className = 'deck-legend';
    legend.innerHTML = `<span class="lg"><span class="pip auth"></span>Authentic</span>`
      + `<span class="lg"><span class="pip wc"></span>WC</span>`
      + `<span class="lg"><span class="pip proxy"></span>Proxy</span>`
      + `<span class="lg"><span class="pip miss"></span>Missing</span>`;
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-deck';
    copyBtn.title = 'Copy decklist';
    copyBtn.setAttribute('aria-label', 'Copy decklist');
    copyBtn.innerHTML = `<svg class="ic-copy" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`
      + `<svg class="ic-done" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
    copyBtn.onclick = (e) => { e.stopPropagation(); copyDeckList(deck, copyBtn); };
    legend.appendChild(copyBtn);
    cw.appendChild(legend);
    for(const [key, label] of SECTIONS){
      const sectionRows = arr.filter(c => c.category === key);
      if(sectionRows.length === 0) continue;
      const sectionTotal = sectionRows.reduce((s,c)=> s + (Number(c.count)||0), 0);
      const secHead = document.createElement('div');
      secHead.className = 'section-head';
      secHead.innerHTML = `<span>${label}</span><span class="section-total">${sectionTotal}</span>`;
      cw.appendChild(secHead);
      for(const c of sectionRows) cw.appendChild(makeRow(c, query));
    }
    d.appendChild(cw);
    list.appendChild(d);
  }
}

/* ---------- cards inventory (data/inventory.json) ----------
   Vig's physical collection. Deck usage is derived live from CARDS so it stays
   correct as decks change; a card in no deck is "Spare". Inventory card names
   are matched to deck card names with invKey(): accent/case/punctuation-blind,
   ignoring "(variant)" tags and a leading "Basic ", so "Tapu Lele GX",
   "Tapu Lele-GX" and "Basic Metal Energy" all find their deck rows. */
const invQEl = document.getElementById('inv-q');
const invFilterEl = document.getElementById('inv-filter');
const invStatsEl = document.getElementById('inv-stats');
const invListEl = document.getElementById('inv-list');
let invQuery = '';
let invFilter = 'ALL';

function invKey(s){
  return String(s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/\u2019/g, "'")
    .replace(/\([^)]*\)/g, '')
    .replace(/^basic\s+/, '')
    .replace(/[^a-z0-9]+/g, '');
}
// name key -> [{deck, count}], built once per render from the deck data
const INV_CURRENT_YEAR = '2026';
function invDeckIndex(){
  // Only current-format decks. Copies held by older decks are already listed
  // as their own variants (with the deck named as the source), so re-listing
  // them here would double up; 2026 decks are the ones drawing on loose stock.
  const idx = new Map();
  for(const c of CARDS){
    if(c.year !== INV_CURRENT_YEAR) continue;
    const k = invKey(c.name);
    if(!idx.has(k)) idx.set(k, new Map());
    const m = idx.get(k);
    m.set(c.deck, (m.get(c.deck) || 0) + (Number(c.count) || 0));
  }
  return idx;
}
// Loose copies. A variant still marked "Sheet" is unassigned stock; once Vig
// tells us which deck holds those copies, the variant names that deck and is
// no longer spare. Current-format decks with no explicit assignment yet are
// still assumed to be drawing on the unassigned pile.
function invAssignedDecks(g){
  return new Set(g.variants.map(v => v.source).filter(s => s && s !== 'Sheet'));
}
function invLoose(g){
  return g.variants.reduce((s,v) =>
    s + ((!v.source || v.source === 'Sheet') ? (Number(v.qty) || 0) : 0), 0);
}
// Each row is one PRINT of a card, but current-format deck usage is only known
// per card name, so a card's unassigned usage is consumed greedily across its
// print rows (rows with loose stock absorb it first). Whatever loose stock is
// left on a row is genuinely spare.
function invAllocate(items, idx){
  const byCard = new Map();
  for(const g of items){
    if(!byCard.has(g.key)) byCard.set(g.key, []);
    byCard.get(g.key).push(g);
  }
  const alloc = new Map();          // printKey -> {spare, decks:[[deck,n]]}
  for(const [key, rows] of byCard){
    // a deck named on ANY print of this card is already accounted for there
    const assigned = new Set();
    rows.forEach(r => invAssignedDecks(r).forEach(d => assigned.add(d)));
    const owed = [...(idx.get(key) || new Map()).entries()]
      .filter(([d]) => !assigned.has(d))
      .map(([d,n]) => [d, n]);
    let oi = 0;
    for(const r of rows){
      let loose = invLoose(r);
      const took = [];
      while(loose > 0 && oi < owed.length){
        const take = Math.min(loose, owed[oi][1]);
        took.push([owed[oi][0], take]);
        loose -= take;
        owed[oi][1] -= take;
        if(owed[oi][1] === 0) oi++;
      }
      alloc.set(r.printKey || r.key, {spare: loose, decks: took});
    }
  }
  return alloc;
}
function renderInventory(){
  if(!invListEl) return;
  const idx = invDeckIndex();
  const q = invQuery.toLowerCase();
  const alloc = invAllocate(INVENTORY, idx);
  let items = INVENTORY.map(g => {
    const a = alloc.get(g.printKey || g.key) || {spare: 0, decks: []};
    // only the current-format usage this row actually supplies
    const decks = a.decks.slice().sort((x,y) => y[1] - x[1] || x[0].localeCompare(y[0]));
    return {...g, decks, spare: a.spare};
  });
  if(invFilter === 'INDECK') items = items.filter(g => g.total > g.spare);
  else if(invFilter === 'SPARE') items = items.filter(g => g.spare > 0);
  else if(invFilter === 'VERIFIED') items = items.filter(g => g.verified);
  else if(invFilter === 'UNVERIFIED') items = items.filter(g => !g.verified);
  else if(invFilter !== 'ALL') items = items.filter(g => invCat(g.type) === invFilter);
  // Card name or set code only. Deck names are deliberately NOT searched:
  // matching them dragged in every staple a deck happens to play (searching
  // "dragapult" returned Boss's Orders), and the decks tab already lists a
  // deck's cards.
  if(q) items = items.filter(g =>
    g.name.toLowerCase().includes(q) ||
    (g.set || '').toLowerCase() === q);

  const copies = items.reduce((s,g) => s + g.total, 0);
  const spare = items.reduce((s,g) => s + g.spare, 0);
  const okd = items.filter(g => g.verified).length;
  invStatsEl.textContent =
    `${items.length} card${items.length !== 1 ? 's' : ''} · ${copies} total cop${copies !== 1 ? 'ies' : 'y'}`
    + ` · ${spare} spare · ${okd}/${items.length} verified`;

  if(!items.length){
    invListEl.innerHTML = '<div class="empty">No cards match your search.</div>';
    return;
  }
  invListEl.innerHTML = items.map(g => {
    // image lives on the entry now (one print = one image); the variant
    // fallback covers any row written before the per-print split
    const img = g.image || (g.variants.find(v => v.image) || {}).image || '';
    // One row per print already, so just list this print's types and the deck
    // holding each. Print type (World Champs / Authentic / Proxy / Standard...)
    // is the second axis: several types of the SAME print sit together here.
    const vars = g.variants.map(v => {
      const src = v.source && v.source !== 'Sheet'
        ? `<span class="inv-src inv-src-deck">${esc(v.source)}</span>`
        : `<span class="inv-src">Sheet</span>`;
      return `<span class="inv-var"><b>${v.qty}</b> ${esc(v.version)}${src}</span>`;
    }).join('');
    // g.decks is already just the current-format usage this row supplies from
    // its loose stock; decks holding assigned copies are named on the lines above.
    const parts = g.decks.map(([d,n]) => `${esc(d)} ×${n}`);
    if(g.spare > 0) parts.push(`<span class="inv-spare">Spare ×${g.spare}</span>`);
    const decks = parts.join(' · ');
    return `<div class="inv-item${img ? '' : ' inv-noimg'}" data-img="${esc(img)}" data-name="${esc(g.name)}">
      <span class="inv-main">
        <span class="inv-title"><span class="inv-name">${esc(g.name)}</span>`
      + `${(g.set || g.num) ? `<span class="inv-set">${esc(((g.set || '') + ' ' + (g.num || '')).trim())}</span>` : '<span class="inv-set inv-set-unknown">set unknown</span>'}`
      + `<span class="inv-qty">${g.total}</span>`
      + `${g.verified ? '<span class="inv-ok" title="Checked with Vig">✓</span>' : '<span class="inv-todo" title="Not verified yet">•</span>'}</span>
        <span class="inv-vars">${vars}</span>
        ${decks ? `<span class="inv-decks">${decks}</span>` : ''}
      </span>
    </div>`;
  }).join('');
  invListEl.querySelectorAll('.inv-item').forEach(el => {
    el.onclick = () => { if(el.dataset.img) openImageModal(el.dataset.img, el.dataset.name); };
  });
}
// spreadsheet "Card Type" (Item/Supporter/Stadium/Pokémon/Energy) -> our 3 categories
function invCat(t){
  const s = String(t || '').toLowerCase();
  if(s.startsWith('pok')) return 'Pokemon';
  if(s === 'energy') return 'Energy';
  return 'Trainer';
}
invQEl.addEventListener('input', e => { invQuery = e.target.value.trim(); renderInventory(); });
invFilterEl.addEventListener('change', e => { invFilter = e.target.value; renderInventory(); });
