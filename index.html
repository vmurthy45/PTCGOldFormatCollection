<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EE2B39">
<title>Vig's Pokémon TCG Old Format Collection</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CclipPath id='t'%3E%3Cpath d='M4 50A46 46 0 0 1 96 50Z'/%3E%3C/clipPath%3E%3CclipPath id='b'%3E%3Cpath d='M4 50A46 46 0 0 0 96 50Z'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%2339424B' stroke-width='6'/%3E%3Cpath d='M4 50A46 46 0 0 1 96 50Z' fill='%23F0504A'/%3E%3Cg clip-path='url(%23t)'%3E%3Cellipse cx='80' cy='22' rx='28' ry='32' fill='%23D8413C'/%3E%3C/g%3E%3Cg clip-path='url(%23b)'%3E%3Cellipse cx='80' cy='78' rx='30' ry='26' fill='%23E4E6E9'/%3E%3C/g%3E%3Crect x='4' y='44' width='92' height='12' fill='%2339424B'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23fff'/%3E%3Ccircle cx='50' cy='50' r='13' fill='%2339424B'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#EE2B39; --red-dark:#C81E2B; --charcoal:#3B4048; --charcoal-dark:#2B2F35;
    --ink:#2b2f35; --muted:#7a828d; --line:#e2c9cc; --bg:#f5f2f2; --card:#ffffff;
    --band-a:#fdeced; --band-b:#f8f5f5; --cnt-bg:#fbd9dc; --steel:#5a6470;
    --mark-bg:#ffe58a; --mark-ink:#2b2f35; --overlay:rgba(20,18,19,.6);
    --pokeball-ink:#202225; --shadow:rgba(59,64,72,.14);
    --chip-bg:#ffffff; --rules-header:#202225; --rules-panel:#ffffff;
    --miss-red-line:#d5303b; --miss-red-bg:rgba(213,48,59,.13);
    --miss-orange-line:#d9820f; --miss-orange-bg:rgba(224,138,30,.16);
  }
  :root[data-theme="dark"]{
    /* Only the background/surface colors change for dark mode - the red
       accent and pokeball icon stay pinned to the same values as light mode.
       --charcoal/--charcoal-dark are the exception: they're real text colors
       used inside guide content (headings, bold text) on the card background,
       so they still need to flip light-on-dark or that text becomes
       unreadable. --chip-bg/--rules-header/--rules-panel are a notch
       lighter than --card/--pokeball-ink so the year filters and the Turn
       1 Rules box don't blend into the page background. */
    --charcoal:#c7cbd1; --charcoal-dark:#f1f1f3;
    --ink:#e8e8ea; --muted:#9099a3; --line:#33383f; --bg:#131417; --card:#1c1f24;
    --band-a:#2a1c1e; --band-b:#20232a; --cnt-bg:#3a2226; --steel:#9099a3;
    --overlay:rgba(0,0,0,.75); --shadow:rgba(0,0,0,.45);
    --chip-bg:#262b32; --rules-header:#2c3138; --rules-panel:#20242b;
    /* Slightly stronger missing-row tints so they read on the dark card. */
    --miss-red-bg:rgba(213,48,59,.24); --miss-orange-bg:rgba(224,138,30,.24);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--red);
    color:#fff; padding:0; box-shadow:0 4px 16px var(--shadow);
  }
  .head-inner{
    max-width:820px; margin:0 auto; display:flex; align-items:center; gap:14px;
    padding:15px 18px; padding-top:calc(15px + env(safe-area-inset-top));
  }
  header svg{width:42px; height:42px; flex:0 0 auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  header h1{
    font-family:'Poppins',sans-serif; font-size:19px; margin:0; font-weight:700;
    letter-spacing:.2px; line-height:1.2;
  }
  header .sub{font-size:12.5px; opacity:.88; margin-top:2px; font-weight:500; letter-spacing:.1px}
  .theme-toggle{
    margin-left:auto; flex:0 0 auto; width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.14); color:#fff;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15); transition:background .15s,transform .15s;
  }
  .theme-toggle:hover{background:rgba(255,255,255,.24); transform:translateY(-1px)}
  /* thin charcoal accent line under header, echoing pokeball seam */
  .seam{height:4px; background:var(--pokeball-ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .wrap{max-width:820px; margin:0 auto; padding:16px 12px 40px}
  .tabs{display:flex; gap:8px; margin-bottom:18px; border-bottom:1px solid var(--line)}
  .tab-btn{
    padding:11px 18px; border:none; background:transparent; cursor:pointer;
    font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; color:var(--muted);
    border-bottom:3px solid transparent; margin-bottom:-1px; transition:color .15s,border-color .15s;
  }
  .tab-btn:hover{color:var(--red-dark)}
  .tab-btn.active{color:var(--red-dark); border-bottom-color:var(--red)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  /* sub-switcher inside the Tools tab */
  .subtabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .subtab-btn{
    padding:8px 15px; border:1px solid var(--line); background:var(--chip-bg); cursor:pointer;
    font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; color:var(--muted);
    border-radius:999px; transition:background .15s,color .15s,border-color .15s;
  }
  .subtab-btn:hover{color:var(--red-dark)}
  .subtab-btn.active{background:var(--red); color:#fff; border-color:var(--red)}
  .subtab-panel{display:none}
  .subtab-panel.active{display:block}
  .controls{display:flex; flex-direction:column; gap:10px; margin-bottom:12px}
  .search{
    width:100%; padding:13px 16px; font-size:16px; border:1px solid var(--line);
    border-radius:13px; background:var(--card); color:var(--ink); outline:none;
    box-shadow:0 1px 2px var(--shadow); transition:box-shadow .15s,border-color .15s;
  }
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:var(--red); box-shadow:0 0 0 3px rgba(238,43,57,.15)}
  /* compact default (once a year/All is picked and decks are showing) */
  .filters{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    box-sizing:border-box; width:62px; flex:0 0 62px; text-align:center;
    padding:7px 0; border-radius:999px; border:1px solid var(--line);
    background:var(--chip-bg); color:var(--red-dark); font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap; user-select:none; font-variant-numeric:tabular-nums;
    transition:background .15s,color .15s,border-color .15s,transform .15s,box-shadow .15s;
    box-shadow:0 1px 2px var(--shadow);
  }
  .chip:hover{border-color:var(--red); transform:translateY(-1px)}
  .chip.active{background:var(--red); color:#fff; border-color:var(--red); box-shadow:0 3px 10px rgba(238,43,57,.35)}
  /* a year with no decks yet (e.g. 2011) is greyed until one is added */
  .chip.chip-empty{opacity:.5; color:var(--muted); box-shadow:none}
  .chip.chip-empty:hover{border-color:var(--line); transform:none}
  /* landing (no year picked yet): large, prominent 5-per-row tiles + only the filters */
  .controls.landing .filters{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px}
  .controls.landing .chip{width:auto; flex:none; padding:15px 4px; border-radius:13px; font-size:16px; font-weight:700}
  .controls.landing .chip.chip-all{grid-column:1 / -1}  /* "All" spans the bottom row */
  .controls.landing #q, .controls.landing #missingToggle{display:none}
  /* Turn 1 Rules button — landing only, styled like the per-year rules boxes */
  .t1-landing-btn{
    display:none; width:100%; padding:15px 16px; border:none; border-radius:13px; cursor:pointer;
    background:var(--rules-header); color:#fff; font-family:'Poppins',sans-serif; font-size:15px;
    font-weight:600; box-shadow:0 2px 10px var(--shadow); transition:filter .15s;
  }
  .controls.landing .t1-landing-btn{display:block}
  .t1-landing-btn:hover{filter:brightness(1.2)}
  .t1-landing-btn.active{box-shadow:0 0 0 2px var(--red)}
  /* aggregate turn-1 list: compact year tiles (5/row) that expand their rules */
  .t1-agg{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; align-items:start}
  .t1-tile{
    padding:15px 4px; border:1px solid var(--line); border-radius:13px; cursor:pointer;
    background:var(--rules-header); color:#fff; font-family:'Poppins',sans-serif;
    font-size:16px; font-weight:700; text-align:center; box-shadow:0 1px 2px var(--shadow);
    font-variant-numeric:tabular-nums; transition:filter .15s;
  }
  .t1-tile:hover{filter:brightness(1.25)}
  .t1-tile.active{box-shadow:0 0 0 2px var(--red)}
  .t1-tile-panel{
    display:none; grid-column:1 / -1; padding:14px 16px; border:1px solid var(--line);
    border-radius:13px; background:var(--rules-panel); color:var(--ink);
  }
  .t1-tile-panel.open{display:block}
  /* landing intro / how-to blurb (shown when no year is selected) */
  .home-blurb{max-width:640px; margin:6px auto 0; color:var(--ink); line-height:1.55; font-size:14.5px; text-align:left}
  .home-blurb .home-title{font-family:'Poppins',sans-serif; font-size:19px; font-weight:600; margin:32px 0 14px; color:var(--ink)}
  .home-blurb .home-title:first-child{margin-top:0}
  .home-blurb .blurb-a,
  .home-blurb .blurb-link{color:var(--red-dark); font-weight:600; text-decoration:underline; cursor:pointer}
  .home-blurb .blurb-link{text-decoration-style:dotted; text-underline-offset:2px}
  .home-blurb .blurb-a:hover,
  .home-blurb .blurb-link:hover{color:var(--red)}
  .home-blurb p{margin:0 0 12px}
  .home-blurb h3{font-family:'Poppins',sans-serif; font-size:15px; font-weight:600; margin:20px 0 8px}
  .home-blurb ul{margin:0; padding-left:20px}
  .home-blurb li{margin:6px 0}
  .home-blurb .fav-star{width:16px; height:16px; vertical-align:-3px}
  .home-blurb .tier-badge{vertical-align:1px}
  .stats{font-size:13px; color:var(--muted); margin:2px 2px 14px; font-weight:500}
  .turn1-box{
    background:var(--rules-panel); border:1px solid var(--line); border-radius:16px;
    margin-bottom:16px; overflow:hidden; box-shadow:0 2px 10px var(--shadow);
  }
  .turn1-box[hidden]{display:none}
  .t1-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; cursor:pointer; color:#fff; background:var(--rules-header); border:none;
    font-family:'Poppins',sans-serif; font-size:14.5px; font-weight:600; text-align:left;
  }
  .t1-toggle:hover{filter:brightness(1.2)}
  .t1-arrow{transition:transform .2s; font-size:12px}
  .t1-toggle.active .t1-arrow{transform:rotate(90deg)}
  .t1-panel{display:none; padding:16px}
  .t1-panel.open{display:block}
  .t1-flip{font-size:14px; margin-bottom:10px}
  .t1-flip strong{font-family:'Poppins',sans-serif}
  .t1-sub{font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .t1-rule{font-size:14px; padding:6px 0; display:flex; align-items:center; gap:8px}
  /* matchup generator */
  .matchup-controls{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px}
  .matchup-select{
    flex:1 1 200px; padding:12px 14px; font-size:15px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); color:var(--ink); font-family:inherit;
    box-shadow:0 1px 2px var(--shadow);
  }
  .matchup-btn{
    flex:0 0 auto; padding:12px 20px; border:none; border-radius:12px; cursor:pointer;
    background:var(--red); color:#fff; font-family:'Poppins',sans-serif; font-size:14.5px;
    font-weight:600; box-shadow:0 3px 10px rgba(238,43,57,.3); transition:transform .15s,box-shadow .15s;
  }
  .matchup-btn:hover{transform:translateY(-1px); box-shadow:0 5px 16px rgba(238,43,57,.4)}
  .matchup-empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:15px}
  .matchup-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:28px 20px; box-shadow:0 2px 10px var(--shadow); text-align:center;
  }
  .matchup-format{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
    color:var(--muted); background:var(--band-b); padding:4px 12px; border-radius:999px; margin-bottom:20px;
  }
  .matchup-vs{display:flex; align-items:center; justify-content:center; gap:18px}
  .matchup-deck{
    flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--band-a); cursor:pointer;
    border-radius:14px; padding:18px 14px; font-family:'Poppins',sans-serif; font-size:16px;
    font-weight:600; color:var(--ink); transition:transform .15s,box-shadow .15s,border-color .15s;
  }
  .matchup-deck:hover{transform:translateY(-2px); box-shadow:0 6px 16px var(--shadow); border-color:var(--red)}
  .matchup-vs-label{flex:0 0 auto; font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; color:var(--red)}
  .matchup-hint{margin-top:16px; font-size:12.5px; color:var(--muted)}
  /* card collection (aggregate) tab */
  .cc-controls-row{display:flex; flex-wrap:wrap; gap:10px}
  .cc-select{
    flex:1 1 160px; padding:12px 14px; font-size:15px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); color:var(--ink); font-family:inherit;
    box-shadow:0 1px 2px var(--shadow);
  }
  .cc-export-btn{
    flex:0 0 auto; padding:12px 18px; border:none; border-radius:12px; cursor:pointer;
    background:var(--red); color:#fff; font-family:'Poppins',sans-serif; font-size:14px;
    font-weight:600; box-shadow:0 3px 10px rgba(238,43,57,.3); transition:transform .15s,box-shadow .15s;
  }
  .cc-export-btn:hover{transform:translateY(-1px); box-shadow:0 5px 16px rgba(238,43,57,.4)}
  .cc-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px var(--shadow); background:var(--card)}
  .cc-table{border-collapse:collapse; width:100%; font-size:13.5px}
  .cc-table th,.cc-table td{padding:10px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
  .cc-table thead th{
    position:sticky; top:0; background:var(--red); color:#fff; font-family:'Poppins',sans-serif;
    font-weight:600; font-size:12.5px; white-space:nowrap; cursor:pointer; user-select:none;
  }
  .cc-table thead th:hover{filter:brightness(1.1)}
  .cc-table thead th .cc-arrow{font-size:10px; opacity:.9}
  .cc-table tbody tr:last-child td{border-bottom:none}
  .cc-table tbody tr:hover{background:var(--band-a)}
  .cc-name{font-weight:600; color:var(--ink); white-space:nowrap}
  .cc-num{text-align:center; font-variant-numeric:tabular-nums; font-weight:700}
  .cc-cat{color:var(--muted); font-size:12px; white-space:nowrap}
  .cc-sets{color:var(--muted); font-size:12px; max-width:170px; line-height:1.5}
  .cc-decks{min-width:240px}
  .cc-deck-pill{
    display:inline-block; background:var(--band-a); border:1px solid var(--line); border-radius:999px;
    padding:2px 9px; margin:2px 3px 2px 0; font-size:12px; color:var(--charcoal); white-space:nowrap;
  }
  .cc-deck-pill b{color:var(--red-dark); font-variant-numeric:tabular-nums}
  .cc-empty{text-align:center; color:var(--muted); padding:50px 20px; font-size:15px}
  /* game log */
  .gl-filters{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px}
  .gl-filters .cc-select{flex:1 1 200px}
  .gl-summary{font-size:13.5px; color:var(--muted); margin:2px 2px 14px; font-weight:500; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center}
  .gl-summary b{color:var(--ink)}
  .gl-rec-w{color:#1f9d55; font-weight:700}
  .gl-rec-l{color:var(--miss-red-line); font-weight:700}
  .gl-rec-t{color:var(--muted); font-weight:700}
  .gl-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px var(--shadow); background:var(--card)}
  .gl-table{border-collapse:collapse; width:100%; font-size:13.5px}
  .gl-table th,.gl-table td{padding:10px 13px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap}
  .gl-table thead th{background:var(--red); color:#fff; font-family:'Poppins',sans-serif; font-weight:600; font-size:12.5px}
  .gl-table tbody tr:last-child td{border-bottom:none}
  .gl-table tbody tr:hover{background:var(--band-a)}
  .gl-table td.gl-notes{white-space:normal; min-width:140px; color:var(--muted)}
  .gl-res{display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700}
  .gl-res.Win{background:rgba(31,157,85,.16); color:#1f9d55}
  .gl-res.Loss{background:var(--miss-red-bg); color:var(--miss-red-line)}
  .gl-res.Tie{background:var(--band-b); color:var(--muted)}
  .gl-del{background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px; line-height:1}
  .gl-del:hover{color:var(--miss-red-line)}
  .gl-empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:15px}
  .deck{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    margin-bottom:16px; overflow:hidden; box-shadow:0 2px 10px var(--shadow);
    transition:box-shadow .2s,transform .2s;
  }
  .deck:hover{box-shadow:0 6px 20px var(--shadow); transform:translateY(-1px)}
  .deck-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; cursor:pointer; color:#fff;
    background:var(--red);
    border-bottom:3px solid var(--pokeball-ink);
  }
  .deck-head .title{font-family:'Poppins',sans-serif; font-weight:600; font-size:15.5px; letter-spacing:.1px}
  /* "favourite deck of the year" star (marked per deck in FAVOURITES) */
  .fav-star{width:19px; height:19px; vertical-align:-4px; margin-left:7px; flex:0 0 auto}
  /* minimalist per-deck tier badge (marked in TIERS) */
  .tier-badge{display:inline-flex; align-items:center; justify-content:center;
    min-width:17px; height:17px; padding:0 4px; margin-left:8px; border-radius:5px;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:10.5px; line-height:1;
    letter-spacing:.2px; color:#2f2a26; vertical-align:2px; flex:0 0 auto}
  .tier-badge.tier-S{background:#FFD43B}
  .tier-badge.tier-A{background:#CED4DA}
  .tier-badge.tier-B{background:#E8B48A}
  .deck-head .meta{font-size:12px; opacity:.9; font-weight:500; display:flex; align-items:center; gap:8px}
  .deck-head .arrow{transition:transform .2s; font-size:12px; opacity:.95}
  .deck.collapsed .arrow{transform:rotate(-90deg)}
  .deck.collapsed .cards{display:none}
  .deck.collapsed .guidebar{display:none}
  .deck.collapsed .guide-panel{display:none}
  .deck.collapsed .deck-head{border-bottom:none}
  .deck.guide-open .cards{display:none}
  .cards{padding:4px 0}
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 5px; font-size:11px; font-weight:700; letter-spacing:.8px;
    text-transform:uppercase; color:var(--muted);
  }
  .section-total{
    background:var(--band-b); color:var(--muted); font-weight:700; font-size:11px;
    padding:2px 9px; border-radius:999px;
  }
  .row{
    display:grid; grid-template-columns:34px 1fr auto; gap:8px; align-items:center;
    padding:10px 16px; border-top:1px solid var(--band-b); font-size:14px; cursor:pointer;
    transition:background .12s;
  }
  .row:hover{background:var(--band-a)}
  .row:first-child{border-top:none}
  .row .cnt{
    background:var(--cnt-bg); color:var(--red-dark); font-weight:700; text-align:center;
    border-radius:7px; padding:3px 0; font-size:13px;
  }
  .row .nm{font-weight:500}
  .row .st{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; text-align:right}
  /* Missing-card highlighting: orange = own some but short, red = own none. */
  .row.miss-some{background:var(--miss-orange-bg); box-shadow:inset 3px 0 0 var(--miss-orange-line)}
  .row.miss-all{background:var(--miss-red-bg); box-shadow:inset 3px 0 0 var(--miss-red-line)}

  .row.miss-all:hover{background:var(--miss-red-bg); filter:brightness(1.05)}

    display:inline-block; margin-left:7px; font-size:10.5px; font-weight:700; color:#fff;
    padding:1px 7px; border-radius:6px; vertical-align:middle; letter-spacing:.2px; white-space:nowrap;

  .miss-filter.active{background:var(--miss-orange-line); color:#fff}
  mark{background:var(--mark-bg); color:var(--mark-ink); border-radius:3px; padding:0 1px}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:15px}
  /* guide expander */
  .guidebar{border-top:1px solid var(--band-b); background:var(--band-a)}

    width:100%; text-align:left; border:none; background:transparent; cursor:pointer;

  .guide-panel{display:none; padding:2px 20px 20px; font-size:13.5px; line-height:1.6; color:var(--ink)}

  .guide-panel h1{font-family:'Poppins',sans-serif; font-size:17px; margin:16px 0 5px; color:var(--red-dark); font-weight:700}

  .guide-panel code{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:0 3px; font-size:12px}
  .guide-panel em{color:var(--muted)}
  .guide-panel blockquote{margin:8px 0; padding:6px 12px; border-left:3px solid var(--red); background:var(--card); color:var(--charcoal)}
  .guide-panel hr{border:none; border-top:1px solid var(--line); margin:12px 0}
  .guide-panel strong{color:var(--charcoal-dark)}
  /* Guides may include a small reference table (e.g. Spiritomb's damage-per-counter
     row). Wide ones scroll inside their own box rather than stretching the panel. */
  .guide-panel .table-wrap{overflow-x:auto; margin:10px 0}

  .guide-panel th{background:var(--band-a); color:var(--charcoal-dark); font-weight:600}
  .count-badge{background:rgba(255,255,255,.24); padding:2px 8px; border-radius:999px; font-size:11px}
  .loading{text-align:center; color:var(--muted); padding:40px 20px; font-size:15px}
  /* card image modal */
  .modal-overlay{
    position:fixed; inset:0; background:var(--overlay); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay[hidden]{display:none}
  .modal-box{
    position:relative; max-width:480px; width:100%; background:var(--card);
    border-radius:18px; padding:20px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.45);

  @media (min-width:640px){

  .modal-close{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    border:none; background:var(--band-b); color:var(--ink); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
    box-shadow:0 1px 3px var(--shadow);

  .modal-body img{max-width:100%; width:100%; height:auto; border-radius:12px; display:block; margin:0 auto; box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .modal-noimg{padding:60px 10px; color:var(--muted); font-size:14px}

<script>
/* ---------- theme ---------- */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
}
(function initTheme(){
  const saved = localStorage.getItem('theme');
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (systemDark ? 'dark' : 'light'));
})();
themeBtn.onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
};

/* ---------- card image modal ---------- */
const modal = document.getElementById('imgModal');
const modalBody = modal.querySelector('.modal-body');
function openCardModal(card){
  modalBody.innerHTML = '';
  if(card.image){
    const img = document.createElement('img');
    img.src = card.image;
    img.alt = card.name;
    modalBody.appendChild(img);
  } else {
    const p = document.createElement('div');
    p.className = 'modal-noimg';
    p.textContent = 'No image on file for this print.';
    modalBody.appendChild(p);
  }
  const cap = document.createElement('div');
  cap.className = 'modal-caption';
  cap.textContent = card.set ? `${card.name} · ${card.set}` : card.name;
  modalBody.appendChild(cap);
  modal.hidden = false;
}
// Generic image popup (reuses the card modal) for the About-me photos.
function openImageModal(src, caption){
  modalBody.innerHTML = '';
  const img = document.createElement('img');
  img.src = src; img.alt = caption || '';
  modalBody.appendChild(img);
  if(caption){
    const cap = document.createElement('div');
    cap.className = 'modal-caption';
    cap.textContent = caption;
    modalBody.appendChild(cap);
  }
  modal.hidden = false;
}
modal.addEventListener('click', e => { if(e.target === modal) modal.hidden = true; });
modal.querySelector('.modal-close').onclick = () => modal.hidden = true;
document.addEventListener('keydown', e => { if(e.key === 'Escape') modal.hidden = true; });

/* ---------- data + render ---------- */
let CARDS = [];
let GUIDES = {};
let TURN1_RULES = {};
let GAMES = [];
let YEARS = [];
let activeYear = null;  // null = landing (only the year filters shown)
let showT1 = false;     // on the landing, whether the all-years Turn 1 Rules list is open
let query = '';
let missingOnly = false;

function renderTurn1Box(){
  const box = document.getElementById('turn1Box');
  const data = TURN1_RULES[activeYear];
  if(activeYear === 'ALL' || !data){
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  box.hidden = false;
  const allowedLabels = data.rules.filter(r => r.allowed).map(r => r.label);
  const deniedLabels = data.rules.filter(r => !r.allowed).map(r => r.label);
  const rulesHtml = [
    allowedLabels.length ? `<div class="t1-rule">✅ ${esc(allowedLabels.join('/'))}</div>` : '',
    deniedLabels.length ? `<div class="t1-rule">❌ ${esc(deniedLabels.join('/'))}</div>` : '',
  ].join('');
  box.innerHTML = `
    <button type="button" class="t1-toggle">
      <span>📜 Turn 1 Rules — ${esc(activeYear)}</span>
      <span class="t1-arrow">▶</span>
    </button>
    <div class="t1-panel">
      <div class="t1-flip"><strong>Flip:</strong> ${esc(data.flip)}</div>
      <div class="t1-sub">Player going first:</div>
      ${rulesHtml}
    </div>`;
  const btn = box.querySelector('.t1-toggle');
  const panel = box.querySelector('.t1-panel');
  btn.onclick = () => {
    const isOpen = panel.classList.toggle('open');
    btn.classList.toggle('active', isOpen);
  };
}

// The landing "Turn 1 Rules" button lists every year (each row collapsed
// until clicked). Iterates the rule years, so years without decks (2011) show.
function renderT1AggregateHtml(){
  const years = Object.keys(TURN1_RULES)
    .filter(k => k !== '_comment')
    .sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
  const tiles = years
    .filter(y => TURN1_RULES[y])
    .map(y => `<button type="button" class="t1-tile" data-year="${esc(y)}">${esc(y)}</button>`)
    .join('');
  return `<div class="t1-agg">${tiles}</div>`;
}
// One shared rules panel, inserted after the *whole row* of the clicked tile so
// the other tiles in that row don't reflow. Grid is a fixed 5 columns.
function wireT1Aggregate(){
  const grid = document.querySelector('#list .t1-agg');
  if(!grid) return;
  const COLS = 5;
  const tiles = [...grid.querySelectorAll('.t1-tile')];
  let panel = null, active = null;
  const close = () => {
    if(panel){ panel.remove(); panel = null; }
    if(active){ active.classList.remove('active'); active = null; }
  };
  tiles.forEach((tile, i) => {
    tile.onclick = () => {
      if(active === tile){ close(); return; }
      close();
      active = tile; tile.classList.add('active');
      const d = TURN1_RULES[tile.dataset.year];
      const allowed = d.rules.filter(r => r.allowed).map(r => r.label);
      const denied = d.rules.filter(r => !r.allowed).map(r => r.label);
      panel = document.createElement('div');
      panel.className = 't1-tile-panel open';
      panel.innerHTML = `<div class="t1-flip"><strong>Flip:</strong> ${esc(d.flip)}</div>
        <div class="t1-sub">Player going first:</div>
        ${allowed.length ? `<div class="t1-rule">✅ ${esc(allowed.join('/'))}</div>` : ''}
        ${denied.length ? `<div class="t1-rule">❌ ${esc(denied.join('/'))}</div>` : ''}`;
      const rowEnd = Math.min(i - (i % COLS) + COLS - 1, tiles.length - 1);
      tiles[rowEnd].after(panel);
    };
  });
}
document.getElementById('t1LandingBtn').onclick = () => { showT1 = !showT1; render(); };

    <h2 class="home-title">About me</h2>
    <p>The decks in this collection were curated by me, <strong>Vig M.</strong> I was a
    <a class="blurb-a" href="https://limitlesstcg.com/players/179" target="_blank" rel="noopener noreferrer">Pokémon
    TCG player</a> from New Zealand and I played competitively from
    <strong>2013-2020</strong>. My start in the Pokémon TCG was by pure chance - I happened to

    <p>Over the years, I qualified for the 2014, 2016, 2017, and 2019 Pokémon World

    finish</span> at the 2018 Melbourne Special Event with a Rayquaza Vikavolt deck - a deck

}

  'Baby Blacephalon (2020)': 'A',
  // 2021 — SSH VMAX Standard (Battle Styles -> Chilling Reign)
  'Shadow Rider (2021)': 'S', 'Ice Rider (2021)': 'S',
  'Rapid Strike Urshifu (2021)': 'A', 'Eternatus VMAX (2021)': 'A',
  'Spiritomb (2021)': 'B',
  // 2022 — SSH VSTAR / Fusion Strike Standard
  'Fusion Strike Mew (2022)': 'S', 'Ice Rider Palkia (2022)': 'S',
  'Urshifu VMAX (2022)': 'A', 'ADP Flying Pikachu (2022)': 'A',
  'Malamar Rapid Strike (2022)': 'B',
  // 2023 — SSH->SV transition Standard
  'Colorless Lugia (2023)': 'S', 'Lost Box Kyogre (2023)': 'S', 'Gardevoir (2023)': 'S',
  'Fusion Strike Mew (2023)': 'A',
  // 2024 — SV Standard (Paradox Rift -> Shrouded Fable)
  'Miraidon (2024)': 'S', 'Regidrago (2024)': 'S',
  'Ancient Toolbox (2024)': 'A', 'Iron Thorns (2024)': 'A',
  // 2025 — SV Standard (Surging Sparks -> Destined Rivals)
  'Dragapult (2025)': 'S', 'Raging Bolt (2025)': 'S',
  'Joltdengo (2025)': 'A', 'Gardevoir (2025)': 'A',
};
const tierBadge = (t) =>
  `<span class="tier-badge tier-${t}" title="Tier ${t}">${t}</span>`;

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return t;
  return t.slice(0,i) + '<mark>' + t.slice(i, i+q.length) + '</mark>' + t.slice(i+q.length);
}

const yearsEl = document.getElementById('years');
function chip(label, val){
  const b = document.createElement('div');
  const empty = val !== 'ALL' && !YEARS.includes(val);   // a year with no decks yet
  b.className = 'chip' + (val === 'ALL' ? ' chip-all' : '')
    + (empty ? ' chip-empty' : '') + (val === activeYear ? ' active' : '');
  b.dataset.year = val;
  b.textContent = label;
  // Clicking a year (or All) selects it; clicking the active one deselects
  // back to the landing state (null) where only the year filters show.
  b.onclick = () => setYear(activeYear === val ? null : val);
  return b;
}

// val: a year string, 'ALL' (every deck), or null (landing — just the filters).
function setYear(val){
  activeYear = val;
  if(val === null){            // returning to the landing: clear transient filters
    missingOnly = false; query = ''; showT1 = false;
    document.getElementById('q').value = '';
    missingToggleEl.classList.remove('active');
  }
  document.querySelectorAll('.chip').forEach(c =>
    c.classList.toggle('active', c.dataset.year === String(val)));
  document.querySelector('#collectionTab .controls').classList.toggle('landing', val === null);
  renderTurn1Box();
  render();
}

document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });

const missingToggleEl = document.getElementById('missingToggle');
missingToggleEl.onclick = () => {
  missingOnly = !missingOnly;
  missingToggleEl.classList.toggle('active', missingOnly);
  render();
};

function matches(c, q){
  if(!q) return true;
  q = q.toLowerCase();
  return c.name.toLowerCase().includes(q)
      || c.deck.toLowerCase().includes(q)
      || String(c.set).toLowerCase().includes(q);
}

function makeRow(c, query){
  const r = document.createElement('div');
  const missing = Number(c.missing) || 0;
  const count = Number(c.count) || 0;
  // Own none of a needed card -> red; own some but short -> orange.
  const missClass = missing <= 0 ? '' : (missing >= count ? ' miss-all' : ' miss-some');
  r.className = 'row' + missClass;
  const badge = missing > 0
    ? ` <span class="miss-badge">missing ${missing}${count ? ' of ' + count : ''}</span>`
    : '';
  r.innerHTML = `<span class="cnt">${esc(c.count)}</span>
    <span class="nm">${hl(c.name, query)}${badge}</span>
    <span class="st">${hl(c.set, query)}</span>`;
  r.onclick = () => openCardModal(c);
  return r;
}

function render(){
  if(activeYear === null){   // landing: no decks yet, just the year filters
    document.getElementById('stats').textContent = '';
    document.getElementById('list').innerHTML = showT1
      ? renderT1AggregateHtml()
      : renderHomeBlurbHtml();
    if(showT1) wireT1Aggregate(); else wireHomeBlurb();
    const tb = document.getElementById('t1LandingBtn');
    if(tb) tb.classList.toggle('active', showT1);
    return;
  }
  let rows = CARDS;
  if(activeYear !== 'ALL') rows = rows.filter(c => c.year === activeYear);
  if(query) rows = rows.filter(c => matches(c, query));
  // The Missing filter stacks with the year filter: keep only cards the user
  // is short on (missing > 0). Decks with none then drop out entirely.
  if(missingOnly) rows = rows.filter(c => (Number(c.missing) || 0) > 0);

  const groups = new Map();
  for(const c of rows){
    if(!groups.has(c.deck)) groups.set(c.deck, []);
    groups.get(c.deck).push(c);
  }

  // Decks are always listed alphabetically (case-insensitive), so any deck
  // added later slots into place automatically without touching cards.json's
  // row order. On "All years" the years stay in chronological order (the site
  // is organised by year) and the alphabetical sort applies within each year;
  // filtering to one year makes the whole list alphabetical. deckYear() reads
  // the year off the group's first card rather than parsing the name.
  const deckYear = deck => groups.get(deck)[0].year;
  const sortedDecks = [...groups.keys()].sort((a, b) =>
    (YEARS.indexOf(deckYear(a)) - YEARS.indexOf(deckYear(b))) ||
    a.localeCompare(b, undefined, {sensitivity: 'base'}));

  const list = document.getElementById('list');
  const stats = document.getElementById('stats');
  list.innerHTML = '';

  if(groups.size === 0){
    const where = activeYear !== 'ALL' ? ` in ${esc(activeYear)}` : '';
    list.innerHTML = missingOnly
      ? `<div class="empty">No missing cards${where} — you have everything you need. 🎉</div>`
      : (!query && activeYear !== 'ALL')
        ? `<div class="empty">No decks logged for ${esc(activeYear)} yet.</div>`
        : '<div class="empty">No matches. Try a different search or year.</div>';
    stats.textContent = '';
    return;
  }

  let totalCards = 0;   // card lines (rows)
  let totalQty = 0;     // actual cards, summing each row's count (60 per deck)
  let totalMissing = 0; // copies the user is short on, across shown rows
  for(const arr of groups.values()){
    totalCards += arr.length;
    for(const c of arr){
      totalQty += (Number(c.count) || 0);
      totalMissing += (Number(c.missing) || 0);
    }
  }
  stats.textContent = missingOnly
    ? `${groups.size} deck${groups.size>1?'s':''} · ${totalCards} card${totalCards!==1?'s':''} missing · ${totalMissing} cop${totalMissing!==1?'ies':'y'} to find`
    : `${groups.size} deck${groups.size>1?'s':''} · ${totalCards} unique card${totalCards>1?'s':''} · ${totalQty} total cards`;

  // Auto-expand decks when a filter is narrowing the view (search or Missing).
  const collapsed = !query && !missingOnly;

  for(const deck of sortedDecks){
    const arr = groups.get(deck);
    const d = document.createElement('div');
    d.className = 'deck' + (collapsed ? ' collapsed' : '');
    const total = arr.reduce((s,c)=> s + (Number(c.count)||0), 0);
    const deckMissing = arr.reduce((s,c)=> s + (Number(c.missing)||0), 0);
    const head = document.createElement('div');
    head.className = 'deck-head';
    // Under the Missing filter the badge shows how many copies are short;
    // otherwise the count of cards actually owned (deck size minus any missing),
    // and the pill is tinted (.has-missing) so a short deck stands out.
    const metaHtml = missingOnly
      ? `<span class="count-badge miss">${deckMissing} missing</span>`
      : `<span class="count-badge">${total - deckMissing} cards</span>`;
    if(deckMissing > 0) head.classList.add('has-missing');
    head.innerHTML = `<span class="title">${hl(deck, query)}${FAVOURITES.has(deck) ? FAV_STAR : ''}${TIERS[deck] ? tierBadge(TIERS[deck]) : ''}</span>
      <span class="meta">${metaHtml} <span class="arrow">▼</span></span>`;
    head.onclick = () => d.classList.toggle('collapsed');
    d.appendChild(head);

    const guideHtml = GUIDES[slug(deck)];
    if(guideHtml){
      const bar = document.createElement('div');
      bar.className = 'guidebar';
      const btn = document.createElement('button');
      btn.className = 'guide-btn';
      btn.type = 'button';
      btn.textContent = '📖 See Guide';
      bar.appendChild(btn);
      const panel = document.createElement('div');
      panel.className = 'guide-panel';
      panel.innerHTML = guideHtml;
      // Markdown emits a bare <table>; wrap it so a wide one scrolls inside its
      // own box instead of stretching the deck card and the page with it.
      panel.querySelectorAll('table').forEach(t => {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        t.replaceWith(wrap);
        wrap.appendChild(t);
      });
      btn.onclick = (e) => {
        e.stopPropagation();
        const isOpen = panel.classList.toggle('open');
        d.classList.toggle('guide-open', isOpen);
        btn.classList.toggle('active', isOpen);
        btn.textContent = isOpen ? '✕ Close Guide' : '📖 See Guide';
      };
      d.appendChild(bar);
      d.appendChild(panel);
    }

    const cw = document.createElement('div');
    cw.className = 'cards';
    for(const [key, label] of SECTIONS){
      const sectionRows = arr.filter(c => c.category === key);
      if(sectionRows.length === 0) continue;
      const sectionTotal = sectionRows.reduce((s,c)=> s + (Number(c.count)||0), 0);
      const secHead = document.createElement('div');
      secHead.className = 'section-head';
      secHead.innerHTML = `<span>${label}</span><span class="section-total">${sectionTotal}</span>`;
      cw.appendChild(secHead);
      for(const c of sectionRows) cw.appendChild(makeRow(c, query));
    }
    d.appendChild(cw);
    list.appendChild(d);
  }
}

const matchupFormatEl = document.getElementById('matchupFormat');

function decksForYear(year){
  return [...new Set(CARDS.filter(c => c.year === year).map(c => c.deck))];
}

function pickTwo(arr){
  const pool = [...arr];
  const first = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
  const second = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
  return [first, second];
}

function jumpToDeck(deck, year){
  document.querySelector('.tab-btn[data-tab="collection"]').click();
  setYear(year);
  query = deck;
  document.getElementById('q').value = deck;
  render();
}

function generateMatchup(){
  const chosenYear = matchupFormatEl.value === 'RANDOM'
    ? YEARS[Math.floor(Math.random() * YEARS.length)]
    : matchupFormatEl.value;
  const decks = decksForYear(chosenYear);
  const [deckA, deckB] = pickTwo(decks);
  matchupResultEl.innerHTML = `
    <div class="matchup-card">
      <div class="matchup-format">${esc(chosenYear)} Format</div>
      <div class="matchup-vs">
        <button type="button" class="matchup-deck" data-deck="${esc(deckA)}">${esc(deckA)}</button>
        <div class="matchup-vs-label">VS</div>

      </div>

    </div>`;
  matchupResultEl.querySelectorAll('.matchup-deck').forEach(btn => {
    btn.onclick = () => jumpToDeck(btn.dataset.deck, chosenYear);

}

/* ---------- card collection (aggregate view) ---------- */
const ccYearEl = document.getElementById('cc-year');
const ccQEl = document.getElementById('cc-q');
const ccStatsEl = document.getElementById('cc-stats');
const ccTableWrap = document.getElementById('cc-table-wrap');
const ccExportBtn = document.getElementById('cc-export');

let ccQuery = '';
let ccYear = 'ALL';
let ccSort = { key: 'name', dir: 1 };   // dir: 1 asc, -1 desc

const CAT_LABEL = { Pokemon: 'Pokémon', Trainer: 'Trainer', Energy: 'Energy' };

// Collapse the flat card rows into aggregated entries. Pokémon are keyed by
// (name, set) — different prints are genuinely different cards, so each print
// gets its own line. Trainers/Energy are keyed by name only, since same name =
// same effect regardless of printing (e.g. all Professor's Letter rows become
// one line). copies sums every count; a card can appear on two rows of the
// same deck, so deck counts are summed per deck. Respects the year filter and
// name search.
function ccKey(c){
  return c.category === 'Pokemon' ? c.name + '␀' + c.set : c.name;
}
function ccAggregate(){
  let rows = CARDS;
  if(ccYear !== 'ALL') rows = rows.filter(c => c.year === ccYear);
  if(ccQuery){
    const q = ccQuery.toLowerCase();
    rows = rows.filter(c => c.name.toLowerCase().includes(q));
  }
  const byKey = new Map();
  for(const c of rows){
    const key = ccKey(c);
    let e = byKey.get(key);
    if(!e){ e = { name: c.name, category: c.category, sets: new Set(), copies: 0, decks: new Map() }; byKey.set(key, e); }
    const n = Number(c.count) || 0;
    e.copies += n;
    if(c.set) e.sets.add(c.set);
    const prev = e.decks.get(c.deck);
    e.decks.set(c.deck, { count: (prev ? prev.count : 0) + n, year: c.year });
  }
  return [...byKey.values()];
}
const ccSetStr = e => [...e.sets].join(' / ');

// Decks a card appears in, ordered like the Collection tab: chronological by
// year, then alphabetical within a year.
function ccDeckList(entry){
  return [...entry.decks.entries()].sort((a, b) =>
    (YEARS.indexOf(a[1].year) - YEARS.indexOf(b[1].year)) ||
    a[0].localeCompare(b[0], undefined, {sensitivity: 'base'}));
}

function ccSortRows(rows){
  const { key, dir } = ccSort;
  return rows.sort((a, b) => {
    let cmp;
    if(key === 'copies') cmp = a.copies - b.copies;
    else if(key === 'decks') cmp = a.decks.size - b.decks.size;
    else cmp = a.name.localeCompare(b.name, undefined, {sensitivity: 'base'});
    if(cmp === 0) cmp = a.name.localeCompare(b.name, undefined, {sensitivity: 'base'});
    // Same name (e.g. two Pokémon prints): order by set so it's stable.
    if(cmp === 0) cmp = ccSetStr(a).localeCompare(ccSetStr(b));
    return cmp * dir;
  });
}

function renderCardCollection(){
  const rows = ccSortRows(ccAggregate());
  const totalCopies = rows.reduce((s, r) => s + r.copies, 0);
  ccStatsEl.textContent = `${rows.length} unique card${rows.length !== 1 ? 's' : ''} · ${totalCopies} total cop${totalCopies !== 1 ? 'ies' : 'y'}`;

  if(rows.length === 0){
    ccTableWrap.innerHTML = '<div class="cc-empty">No cards match your search.</div>';
    return;
  }

  const arrow = key => ccSort.key === key ? `<span class="cc-arrow">${ccSort.dir > 0 ? '▲' : '▼'}</span>` : '';
  let html = '<table class="cc-table"><thead><tr>' +
    `<th data-sort="name">Card ${arrow('name')}</th>` +
    '<th>Category</th>' +
    '<th>Set(s)</th>' +
    `<th data-sort="copies" class="cc-num">Copies ${arrow('copies')}</th>` +
    `<th data-sort="decks" class="cc-num">Decks ${arrow('decks')}</th>` +
    '<th>Appears In</th>' +
    '</tr></thead><tbody>';
  for(const r of rows){
    const pills = ccDeckList(r)
      .map(([deck, info]) => `<span class="cc-deck-pill">${esc(deck)} <b>×${info.count}</b></span>`).join('');
    const sets = ccSetStr(r) || '—';
    html += '<tr>' +
      `<td class="cc-name">${hl(r.name, ccQuery)}</td>` +
      `<td class="cc-cat">${esc(CAT_LABEL[r.category] || r.category)}</td>` +
      `<td class="cc-sets">${esc(sets)}</td>` +
      `<td class="cc-num">${r.copies}</td>` +
      `<td class="cc-num">${r.decks.size}</td>` +
      `<td class="cc-decks">${pills}</td>` +
      '</tr>';
  }
  html += '</tbody></table>';
  ccTableWrap.innerHTML = html;

  ccTableWrap.querySelectorAll('th[data-sort]').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.sort;
      if(ccSort.key === key) ccSort.dir *= -1;
      else ccSort = { key, dir: key === 'name' ? 1 : -1 };   // numeric columns default to descending
      renderCardCollection();
    };
  });
}

function ccExportCsv(){
  const rows = ccSortRows(ccAggregate());
  const q = s => { s = String(s); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [['Card', 'Category', 'Set(s)', 'Copies', 'Deck Count', 'Appears In'].join(',')];
  for(const r of rows){
    const appearsIn = ccDeckList(r).map(([deck, info]) => `${deck} x${info.count}`).join('; ');
    lines.push([
      r.name, CAT_LABEL[r.category] || r.category, ccSetStr(r),
      r.copies, r.decks.size, appearsIn,
    ].map(q).join(','));
  }
  // Prepend a BOM so Excel reads the é in "Pokémon" as UTF-8.
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = ccYear === 'ALL' ? 'card-collection.csv' : `card-collection-${ccYear.replace(/\s+/g, '-')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

ccQEl.addEventListener('input', e => { ccQuery = e.target.value.trim(); renderCardCollection(); });
ccYearEl.addEventListener('change', e => { ccYear = e.target.value; renderCardCollection(); });
ccExportBtn.onclick = ccExportCsv;

function glPopulateFilters(){
  const players = [...new Set(GAMES.map(g => g.opponent).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, undefined, {sensitivity: 'base'}));
  const years = [...new Set(GAMES.map(g => g.year).filter(Boolean))]
    .sort((a, b) => (parseInt(a, 10) - parseInt(b, 10)) || b.localeCompare(a));
  glPlayerEl.innerHTML = '<option value="ALL">All opponents</option>' +
    players.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  glYearEl.innerHTML = '<option value="ALL">All formats</option>' +
    years.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join('');
}

function renderGameLog(){
  const player = glPlayerEl.value || 'ALL';
  const year = glYearEl.value || 'ALL';
  let games = GAMES.filter(g =>
    (player === 'ALL' || g.opponent === player) &&
    (year === 'ALL' || g.year === year));
  // Newest first by date; entries without a date keep their file order at the end.
  games = games.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

  if(GAMES.length === 0){
    glSummaryEl.textContent = '';
    glTableWrap.innerHTML = '<div class="gl-empty">No games logged yet.</div>';
    return;
  }
  if(games.length === 0){
    glSummaryEl.textContent = '';
    glTableWrap.innerHTML = '<div class="gl-empty">No games match these filters.</div>';
    return;
  }

  const w = games.filter(g => g.result === 'Win').length;
  const l = games.filter(g => g.result === 'Loss').length;
  const t = games.filter(g => g.result === 'Tie').length;
  const decided = w + l;
  const pct = decided ? Math.round(w / decided * 100) : 0;
  glSummaryEl.innerHTML =
    `<span><b>${games.length}</b> game${games.length !== 1 ? 's' : ''}</span>` +
    `<span><span class="gl-rec-w">${w}W</span> – <span class="gl-rec-l">${l}L</span>` +
      (t ? ` – <span class="gl-rec-t">${t}T</span>` : '') + `</span>` +
    `<span><b>${pct}%</b> win rate${decided ? '' : ' (no decided games)'}</span>`;

  let html = '<div class="gl-table-wrap"><table class="gl-table"><thead><tr>' +
    '<th>Date</th><th>Year</th><th>Vig\'s Deck</th><th>Opponent\'s Deck</th><th>Opponent</th><th>Result</th><th>Notes</th>' +
    '</tr></thead><tbody>';
  for(const g of games){
    const res = ['Win', 'Loss', 'Tie'].includes(g.result) ? g.result : '';
    html += '<tr>' +
      `<td>${esc(g.date || '')}</td>` +
      `<td>${esc(g.year || '')}</td>` +
      `<td>${esc(g.myDeck || '')}</td>` +
      `<td>${esc(g.oppDeck || '')}</td>` +
      `<td>${esc(g.opponent || '')}</td>` +
      `<td>${res ? `<span class="gl-res ${res}">${res}</span>` : esc(g.result || '')}</td>` +
      `<td class="gl-notes">${esc(g.notes || '')}</td>` +
      '</tr>';
  }
  html += '</tbody></table></div>';
  glTableWrap.innerHTML = html;
}

glPlayerEl.addEventListener('change', renderGameLog);
glYearEl.addEventListener('change', renderGameLog);

async function init(){
  const list = document.getElementById('list');
  try{
    const [cardsRes, guidesRes, turn1Res] = await Promise.all([
      fetch('data/cards.json'), fetch('data/guides.json'), fetch('data/turn1_rules.json')
    ]);
    CARDS = await cardsRes.json();
    GUIDES = await guidesRes.json();
    TURN1_RULES = await turn1Res.json();
  }catch(err){
    list.innerHTML = '<div class="empty">Couldn\'t load the collection data. If you opened this file directly from disk, serve it over http(s) instead (fetch() of local JSON is blocked from file://).</div>';
    return;
  }
  // Game Log is a separate, optional data file — a missing/empty games.json
  // must never break the rest of the site.
  try{ GAMES = await (await fetch('data/games.json')).json(); }catch(err){ GAMES = []; }
  // Sort chronologically rather than trusting cards.json row order, so a year
  // added later (e.g. 2021) still lands in the right place. The numeric prefix
  // orders the years; the string tiebreak keeps any future same-year labelled
  // event (e.g. a "2018 NAIC", held in June) ahead of the bare year, which
  // always means Worlds in August.
  YEARS = [...new Set(CARDS.map(c => c.year))]
    .sort((a, b) => (parseInt(a, 10) - parseInt(b, 10)) || b.localeCompare(a));
  // Chip list includes every year in range, even ones with no decks yet (2011),
  // which render greyed out via chip-empty until a deck is added.
  const chipYears = [...new Set([...YEARS, '2011'])].sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
  chipYears.forEach(y => yearsEl.appendChild(chip(y, y)));
  yearsEl.appendChild(chip('All', 'ALL'));        // always last, spans the bottom row
  document.querySelector('#collectionTab .controls').classList.add('landing');

  // Tagline range is derived from the data, so adding a 2026+ deck updates it
  // automatically. Any labelled event (e.g. "2018 NAIC") parses to its leading year.
  const yearNums = YEARS.map(y => parseInt(y, 10)).filter(n => !isNaN(n));
  if(yearNums.length){
    const lo = Math.min(...yearNums), hi = Math.max(...yearNums);
    document.getElementById('tagline').textContent =
      `Competitive decks ${lo}${hi !== lo ? '–' + hi : ''}`;
  }

  matchupFormatEl.innerHTML = '<option value="RANDOM">🎲 Random format</option>' +
    YEARS.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join('');
  matchupResultEl.innerHTML = '<div class="matchup-empty">Pick a format (or leave it on Random) and hit Randomize Matchup.</div>';

  ccYearEl.innerHTML = '<option value="ALL">All years</option>' +
    YEARS.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join('');
  renderCardCollection();

  glPopulateFilters();
  renderGameLog();

  render();
}
init();
</script>
</body>
</html>
