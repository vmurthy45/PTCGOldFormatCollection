/* ---------- Cards to Get (aggregated missing across all decks) ---------- */
function cardsToGetData(){
  const byCard = new Map();  // card name -> {name, total, entries[]}
  for(const c of CARDS){
    const m = missingOf(c);
    if(m <= 0) continue;
    if(!byCard.has(c.name)) byCard.set(c.name, {name: c.name, total: 0, entries: []});
    const g = byCard.get(c.name);
    g.total += m;
    g.entries.push({deck: c.deck, year: c.year, need: m, set: c.set, image: c.image,
                    code: setCodeFromImage(c.image)});
  }
  // most-needed first, then alphabetical
  return [...byCard.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
}
function ctgSetLabel(entry){
  if(BASIC_ENERGY_NO[entry.__name]) return `MEE ${BASIC_ENERGY_NO[entry.__name]}`;
  const num = String(entry.set || '').split('/')[0];
  return entry.code && num ? `${entry.code} ${num}` : '';
}
function renderCardsToGet(){
  const wrap = document.getElementById('ctg-list');
  const summary = document.getElementById('ctg-summary');
  if(!wrap) return;
  const cards = cardsToGetData();
  if(!cards.length){
    summary.textContent = '';
    wrap.innerHTML = `<div class="empty">Nothing to get — you own every card in every deck. 🎉</div>`;
    return;
  }
  const totalCopies = cards.reduce((s, c) => s + c.total, 0);
  const deckSet = new Set();
  cards.forEach(c => c.entries.forEach(e => deckSet.add(e.deck)));
  summary.textContent =
    `${totalCopies} cop${totalCopies !== 1 ? 'ies' : 'y'} to get · ${cards.length} unique card${cards.length !== 1 ? 's' : ''} · across ${deckSet.size} deck${deckSet.size !== 1 ? 's' : ''}`;
  wrap.innerHTML = cards.map(c => {
    const labels = [...new Set(c.entries.map(e => ctgSetLabel({...e, __name: c.name})))].filter(Boolean);
    const setLabel = labels.length === 1 ? labels[0] : (labels.length > 1 ? 'multiple prints' : '');
    const decks = c.entries.slice()
      .sort((a, b) => b.need - a.need || a.deck.localeCompare(b.deck))
      .map(e => `${esc(e.deck)} ×${e.need}`).join(' · ');
    const rep = c.entries[0];
    return `<div class="ctg-item" data-img="${esc(rep.image || '')}" data-name="${esc(c.name)}">
      <span class="ctg-need">${c.total}</span>
      <span class="ctg-main">
        <span class="ctg-title"><span class="ctg-name">${esc(c.name)}</span>${setLabel ? `<span class="ctg-set">${esc(setLabel)}</span>` : ''}</span>
        <span class="ctg-decks">${decks}</span>
      </span>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.ctg-item').forEach(el => {
    el.onclick = () => { if(el.dataset.img) openImageModal(el.dataset.img, el.dataset.name); };
  });
}
async function copyCardsToGet(btn){
  const cards = cardsToGetData();
  const lines = cards.map(c => {
    const label = ctgSetLabel({...c.entries[0], __name: c.name});
    return label ? `${c.total} ${c.name} ${label}` : `${c.total} ${c.name}`;
  });
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(_){}
    ta.remove();
  }
  const old = btn.textContent;
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
}

/* ---------- Stats ---------- */
function statSegBar(a, w, p, m, tot, cls){
  const pc = v => tot ? (v / tot * 100) : 0;
  return `<div class="st-bar ${cls || ''}">`
    + (a ? `<span class="st-seg auth" style="width:${pc(a)}%" title="Authentic ${a}"></span>` : '')
    + (w ? `<span class="st-seg wc" style="width:${pc(w)}%" title="WC ${w}"></span>` : '')
    + (p ? `<span class="st-seg proxy" style="width:${pc(p)}%" title="Proxy ${p}"></span>` : '')
    + (m ? `<span class="st-seg miss" style="width:${pc(m)}%" title="Missing ${m}"></span>` : '')
    + `</div>`;
}
function renderStats(){
  const el = document.getElementById('stats-content');
  if(!el) return;
  let A = 0, W = 0, P = 0, M = 0, total = 0;
  const deckMiss = new Map();               // deck -> missing copies
  const byYear = new Map();                 // year -> tallies
  for(const c of CARDS){
    const cnt = Number(c.count) || 0, pr = printsOf(c), m = missingOf(c);
    A += pr.authentic; W += pr.wc; P += pr.proxy; M += m; total += cnt;
    deckMiss.set(c.deck, (deckMiss.get(c.deck) || 0) + m);
    if(!byYear.has(c.year)) byYear.set(c.year, {decks: new Set(), total: 0, a: 0, w: 0, p: 0, m: 0});
    const y = byYear.get(c.year);
    y.decks.add(c.deck); y.total += cnt; y.a += pr.authentic; y.w += pr.wc; y.p += pr.proxy; y.m += m;
  }
  const decks = [...deckMiss.keys()];
  const complete = decks.filter(d => deckMiss.get(d) === 0).length;
  const owned = total - M;
  // Real collection size comes from the inventory: loose stock plus every copy
  // sleeved in a deck. (Deck slots below are what the decks *call for*, which
  // is a different number — a card can be needed by several decks.)
  const invAlloc = invAllocate(INVENTORY, invDeckIndex());
  let ownedCopies = 0, spareCopies = 0;
  for(const g of INVENTORY){
    ownedCopies += Number(g.total) || 0;
    spareCopies += (invAlloc.get(g.printKey || g.key) || {spare: 0}).spare;
  }
  const sleeved = ownedCopies - spareCopies;
  const pct = total ? Math.round(owned / total * 100) : 0;
  const pctOf = n => total ? Math.round(n / total * 100) : 0;
  const tierCount = {S: 0, A: 0, B: 0};
  decks.forEach(d => { const t = TIERS[d]; if(t && tierCount[t] != null) tierCount[t]++; });

  const tile = (num, lbl) => `<div class="st-tile"><div class="st-num">${num}</div><div class="st-lbl">${lbl}</div></div>`;

  const legend = [
    ['auth', 'Authentic', A], ['wc', 'WC', W], ['proxy', 'Proxy', P], ['miss', 'Missing', M],
  ].map(([cls, name, n]) =>
    `<span class="st-key"><span class="pip ${cls}"></span>${name} — <b>${n}</b> (${pctOf(n)}%)</span>`
  ).join('');

  const years = [...byYear.keys()].sort((a, b) =>
    (YEARS.indexOf(a) - YEARS.indexOf(b)) || a.localeCompare(b));
  const formatsHtml = years.map(y => {
    const d = byYear.get(y);
    return `<div class="st-fmt">
      <div class="st-fmt-head"><b>${esc(y)}</b><span>${d.decks.size} deck${d.decks.size !== 1 ? 's' : ''} · ${d.total} cards${d.m ? ` · ${d.m} missing` : ''}</span></div>
      ${statSegBar(d.a, d.w, d.p, d.m, d.total, 'small')}
    </div>`;
  }).join('');

  const tiersHtml = ['S', 'A', 'B'].map(t =>
    `<span class="st-tierkey">${tierBadge(t)} <b>${tierCount[t]}</b> deck${tierCount[t] !== 1 ? 's' : ''}</span>`
  ).join('');

  el.innerHTML = `
    <div class="st-section">
      <h3 class="st-h">Collection</h3>
      <div class="st-tiles">
        ${tile(ownedCopies, 'Cards owned')}
        ${tile(sleeved, 'Sleeved in decks')}
        ${tile(spareCopies, 'Spare')}
        ${tile(new Set(INVENTORY.map(g => g.key)).size, 'Unique cards')}
      </div>
    </div>

    <div class="st-section">
      <h3 class="st-h">Decks</h3>
      <div class="st-tiles">
        ${tile(decks.length, 'Decks')}
        ${tile(total, 'Deck slots')}
        ${tile(M, 'To get')}
        ${tile(`${complete}<span class="st-sub">/${decks.length}</span>`, 'Complete decks')}
        ${tile(`${pct}<span class="st-sub">%</span>`, 'Completion')}
      </div>
    </div>

    <div class="st-section">
      <h3 class="st-h">Print composition (deck cards)</h3>
      ${statSegBar(A, W, P, M, total)}
      <div class="st-legend">${legend}</div>
    </div>

    <div class="st-section">
      <h3 class="st-h">By format</h3>
      <div class="st-formats">${formatsHtml}</div>
    </div>

    <div class="st-section">
      <h3 class="st-h">Deck tiers</h3>
      <div class="st-tiers">${tiersHtml}<span class="st-tierkey">★ <b>${[...FAVOURITES].filter(d => decks.includes(d)).length}</b> favourites</span></div>
    </div>`;
}

/* ---------- Tournament Log ---------- */
// Scarlet & Violet + Mega-era set release dates, newest last. Used to work out
// which Standard sets were legal on a given tournament date.
const STD_SETS = [
  ["SVI","Scarlet & Violet","2023-03-31"], ["PAL","Paldea Evolved","2023-06-09"],
  ["OBF","Obsidian Flames","2023-08-11"], ["MEW","151","2023-09-22"],
  ["PAR","Paradox Rift","2023-11-03"], ["PAF","Paldean Fates","2024-01-26"],
  ["TEF","Temporal Forces","2024-03-22"], ["TWM","Twilight Masquerade","2024-05-24"],
  ["SFA","Shrouded Fable","2024-08-02"], ["SCR","Stellar Crown","2024-09-13"],
  ["SSP","Surging Sparks","2024-11-08"], ["PRE","Prismatic Evolutions","2025-01-17"],
  ["JTG","Journey Together","2025-03-28"], ["DRI","Destined Rivals","2025-05-30"],
  ["BLK","Black Bolt","2025-07-18"], ["WHT","White Flare","2025-07-18"],
  ["MEG","Mega Evolution","2025-09-26"], ["PFL","Phantasmal Flames","2025-11-14"],
  ["ASC","Ascended Heroes","2026-01-30"], ["POR","Perfect Order","2026-03-27"],
  ["CRI","Chaos Rising","2026-05-22"], ["PBL","Pitch Black","2026-07-17"],
].map(([code,name,date]) => ({code, name, date}));
// Standard rotations: each season start (mid-April) sets the earliest legal set.
// A date picks the latest rotation on/before it; the format runs from that set
// to the newest set released by the tournament date.
const STD_ROTATIONS = [
  {from:"2024-04-12", first:"SVI"},   // SV-on (SWSH rotates out)
  {from:"2025-04-11", first:"TEF"},   // Reg G-on (Temporal Forces onward)
];
function formatForDate(dateStr){
  if(!dateStr) return null;
  const released = STD_SETS.filter(s => s.date <= dateStr);
  if(!released.length) return null;
  const last = released[released.length - 1];
  const rot = [...STD_ROTATIONS].reverse().find(r => r.from <= dateStr);
  const firstSet = STD_SETS.find(s => s.code === (rot ? rot.first : STD_SETS[0].code));
  const legal = STD_SETS.filter(s => s.date >= firstSet.date && s.date <= last.date);
  return {first: firstSet, last, legal, label: `${firstSet.name} – ${last.name}`};
}
function fmtDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];
  return `${d} ${mon} ${y}`;
}
function recordStr(r){
  if(!r) return 'TBD';
  return `${r.wins ?? 0}-${r.losses ?? 0}-${r.ties ?? 0}`;
}
function ordinal(n){
  n = Number(n);
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
// collapsed-row summary of result: "1st 5-1-0" (whichever parts are known)
function placeRecordStr(t){
  const place = (t.placement != null) ? ordinal(t.placement) : null;
  const rec = t.record ? recordStr(t.record) : null;
  if(place && rec) return `${place} ${rec}`;
  return place || rec || 'TBD';
}
let tlDeck = 'ALL';
let tlYear = 'ALL';
const tlYearOf = t => String(t.date || '').slice(0, 4);
function tlPopulateFilters(){
  const deckEl = document.getElementById('tl-deck');
  const yearEl = document.getElementById('tl-year');
  if(!deckEl || !yearEl) return;
  const decks = [...new Set(TOURNAMENTS.map(t => t.deck).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'}));
  const years = [...new Set(TOURNAMENTS.map(tlYearOf).filter(Boolean))]
    .sort((a,b) => b.localeCompare(a));       // newest year first
  deckEl.innerHTML = '<option value="ALL">All decks</option>' +
    decks.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  yearEl.innerHTML = '<option value="ALL">All years</option>' +
    years.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join('');
  deckEl.value = tlDeck; yearEl.value = tlYear;
  deckEl.onchange = e => { tlDeck = e.target.value; renderTournamentLog(); };
  yearEl.onchange = e => { tlYear = e.target.value; renderTournamentLog(); };
}
function renderTournamentLog(){
  const el = document.getElementById('tl-content');
  const sumEl = document.getElementById('tl-summary');
  if(!el) return;
  if(!TOURNAMENTS.length){
    if(sumEl) sumEl.textContent = '';
    el.innerHTML = `<div class="empty">No tournaments logged yet.</div>`;
    return;
  }
  let evs = [...TOURNAMENTS].sort((a,b) => (a.date < b.date ? 1 : -1));  // newest first
  if(tlDeck !== 'ALL') evs = evs.filter(t => t.deck === tlDeck);
  if(tlYear !== 'ALL') evs = evs.filter(t => tlYearOf(t) === tlYear);
  if(sumEl){
    // W-L-T across the filtered events, so the record reads at a glance
    let w = 0, l = 0, d = 0;
    evs.forEach(t => { const r = t.record || {};
      w += r.wins || 0; l += r.losses || 0; d += r.ties || 0; });
    const played = w + l + d;
    sumEl.textContent = `${evs.length} event${evs.length !== 1 ? 's' : ''}`
      + (played ? ` · ${w}-${l}-${d}` : '');
  }
  if(!evs.length){
    el.innerHTML = `<div class="empty">No tournaments match that filter.</div>`;
    return;
  }
  const money = v => (v == null) ? 'TBD' : (typeof v === 'number' ? '$' + v : esc(String(v)));
  el.innerHTML = evs.map((t, i) => {
    const fmt = formatForDate(t.date);
    const placement = (t.placement != null)
      ? `${ordinal(t.placement)}${t.players ? ` / ${t.players}` : ''}`
      : 'TBD';
    const tile = (label, val) => `<div class="tl-tile"><div class="tl-tval">${val}</div><div class="tl-tlabel">${label}</div></div>`;
    return `<details class="tl-card">
      <summary class="tl-head">
        <div class="tl-sum-main"><span class="tl-name">${esc(t.name || 'Untitled event')}</span><span class="tl-date">${fmtDate(t.date)}</span></div>
        <div class="tl-sum-sub">${esc(t.deck || '—')}${fmt ? ` · <span class="tl-fmt">${esc(fmt.label)}</span>` : ''} · <b>${esc(placeRecordStr(t))}</b></div>
      </summary>
      <div class="tl-body">
        <div class="tl-tiles">
          ${tile('Record (W-L-T)', recordStr(t.record))}
          ${tile('Placement', esc(placement))}
          ${tile('Players', t.players != null ? t.players : 'TBD')}
        </div>
        ${t.list ? `<details class="tl-list"><summary>Decklist played</summary><button class="tl-copy" type="button" data-idx="${i}">📋 Copy list</button><pre>${esc(t.list)}</pre></details>` : ''}
        ${t.notes ? `<div class="tl-notes"><b>Notes:</b> ${esc(t.notes)}</div>` : ''}
        <div class="tl-money">
          <div class="tl-mitem"><span>Entry cost</span><b>${money(t.entryCost)}</b></div>
          <div class="tl-mitem"><span>Prizes won</span><b>${money(t.prizesWon)}</b></div>
        </div>
      </div>
    </details>`;
  }).join('');
  el.querySelectorAll('.tl-copy').forEach(btn => {
    btn.onclick = async (e) => {
      e.preventDefault();
      const t = evs[Number(btn.dataset.idx)];
      try{ await navigator.clipboard.writeText(t.list); }
      catch(err){ const ta=document.createElement('textarea'); ta.value=t.list; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); }
      const old = btn.textContent; btn.textContent = '✓ Copied'; btn.classList.add('copied');
      clearTimeout(btn._t); btn._t = setTimeout(()=>{ btn.textContent = old; btn.classList.remove('copied'); }, 1500);
    };
  });
}

function renderGameLog(){
  const player = glPlayerEl.value || 'ALL';
  const year = glYearEl.value || 'ALL';
  let games = GAMES.filter(g =>
    (player === 'ALL' || g.opponent === player) &&
    (year === 'ALL' || g.year === year));
  // Newest first by date; entries without a date keep their file order at the end.
  games = games.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

  if(GAMES.length === 0){
    glSummaryEl.textContent = '';
    glTableWrap.innerHTML = '<div class="gl-empty">No games logged yet.</div>';
    return;
  }
  if(games.length === 0){
    glSummaryEl.textContent = '';
    glTableWrap.innerHTML = '<div class="gl-empty">No games match these filters.</div>';
    return;
  }

  const w = games.filter(g => g.result === 'Win').length;
  const l = games.filter(g => g.result === 'Loss').length;
  const t = games.filter(g => g.result === 'Tie').length;
  const decided = w + l;
  const pct = decided ? Math.round(w / decided * 100) : 0;
  glSummaryEl.innerHTML =
    `<span><b>${games.length}</b> game${games.length !== 1 ? 's' : ''}</span>` +
    `<span><span class="gl-rec-w">${w}W</span> – <span class="gl-rec-l">${l}L</span>` +
      (t ? ` – <span class="gl-rec-t">${t}T</span>` : '') + `</span>` +
    `<span><b>${pct}%</b> win rate${decided ? '' : ' (no decided games)'}</span>`;

  let html = '<div class="gl-table-wrap"><table class="gl-table"><thead><tr>' +
    '<th>Date</th><th>Year</th><th>Vig\'s Deck</th><th>Opponent\'s Deck</th><th>Opponent</th><th>Result</th><th>Notes</th>' +
    '</tr></thead><tbody>';
  for(const g of games){
    const res = ['Win', 'Loss', 'Tie'].includes(g.result) ? g.result : '';
    html += '<tr>' +
      `<td>${esc(g.date || '')}</td>` +
      `<td>${esc(g.year || '')}</td>` +
      `<td>${esc(g.myDeck || '')}</td>` +
      `<td>${esc(g.oppDeck || '')}</td>` +
      `<td>${esc(g.opponent || '')}</td>` +
      `<td>${res ? `<span class="gl-res ${res}">${res}</span>` : esc(g.result || '')}</td>` +
      `<td class="gl-notes">${esc(g.notes || '')}</td>` +
      '</tr>';
  }
  html += '</tbody></table></div>';
  glTableWrap.innerHTML = html;
}

glPlayerEl.addEventListener('change', renderGameLog);
glYearEl.addEventListener('change', renderGameLog);

async function init(){
  const list = document.getElementById('list');
  try{
    const [cardsRes, guidesRes, turn1Res] = await Promise.all([
      fetch('data/cards.json'), fetch('data/guides.json'), fetch('data/turn1_rules.json')
    ]);
    CARDS = await cardsRes.json();
    GUIDES = await guidesRes.json();
    TURN1_RULES = await turn1Res.json();
  }catch(err){
    list.innerHTML = '<div class="empty">Couldn\'t load the collection data. If you opened this file directly from disk, serve it over http(s) instead (fetch() of local JSON is blocked from file://).</div>';
    return;
  }
  // Game Log is a separate, optional data file — a missing/empty games.json
  // must never break the rest of the site.
  try{ GAMES = await (await fetch('data/games.json')).json(); }catch(err){ GAMES = []; }
  // Tournament Log is likewise optional — never let it break the site.
  try{ TOURNAMENTS = await (await fetch('data/tournaments.json')).json(); }catch(err){ TOURNAMENTS = []; }
  // Inventory is likewise optional.
  try{ INVENTORY = await (await fetch('data/inventory.json')).json(); }catch(err){ INVENTORY = []; }
  // Sort chronologically rather than trusting cards.json row order, so a year
  // added later (e.g. 2021) still lands in the right place. The numeric prefix
  // orders the years; the string tiebreak keeps any future same-year labelled
  // event (e.g. a "2018 NAIC", held in June) ahead of the bare year, which
  // always means Worlds in August.
  YEARS = [...new Set(CARDS.map(c => c.year))]
    .sort((a, b) => (parseInt(a, 10) - parseInt(b, 10)) || b.localeCompare(a));
  // Chip list includes every year in range, even ones with no decks yet (2011),
  // which render greyed out via chip-empty until a deck is added.
  const chipYears = [...new Set([...YEARS, '2011'])].sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
  chipYears.forEach(y => yearsEl.appendChild(chip(y, y)));
  yearsEl.appendChild(chip('All', 'ALL'));        // always last, spans the bottom row
  document.querySelector('#collectionTab .controls').classList.add('landing');

  // Tagline range is derived from the data, so adding a 2026+ deck updates it
  // automatically. Any labelled event (e.g. "2018 NAIC") parses to its leading year.
  const yearNums = YEARS.map(y => parseInt(y, 10)).filter(n => !isNaN(n));
  if(yearNums.length){
    const lo = Math.min(...yearNums), hi = Math.max(...yearNums);
    document.getElementById('tagline').textContent =
      `Competitive decks ${lo}${hi !== lo ? '–' + hi : ''}`;
  }

  matchupFormatEl.innerHTML = '<option value="RANDOM">🎲 Random format</option>' +
    YEARS.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join('');
  matchupResultEl.innerHTML = '<div class="matchup-empty">Pick a format (or leave it on Random) and hit Randomize Matchup.</div>';

  renderInventory();

  glPopulateFilters();
  renderGameLog();

  renderCardsToGet();
  document.getElementById('ctg-copy').onclick = (e) => copyCardsToGet(e.currentTarget);
  renderStats();
  tlPopulateFilters();
  renderTournamentLog();

  render();
}

/* ---------- private Tools tab ----------
   The Tools tab is hidden for everyone by default (the QR-coded public URL is
   untouched — no hash, no Tools). Visiting the site once with the secret hash
   #tools unlocks it and remembers on that device via localStorage, so from
   then on the plain URL shows Tools for you. Visit #lock to hide it again.
   This is not security (a static page's source is always readable) — it just
   keeps the tab out of the way for other visitors. Change TOOLS_KEY to rename
   the unlock word. */
function isStandaloneApp(){
  // installed to the home screen (iOS web-clip or PWA display:standalone)
  return window.navigator.standalone === true
    || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function applyToolsGate(){
  const TOOLS_KEY = 'tools';
  const btn = document.querySelector('.tab-btn[data-tab="tools"]');
  if(!btn) return;
  const h = (location.hash || '').replace(/^#/, '').toLowerCase();
  // Launched from the home screen? That's an intentional install — always show
  // Tools (this side-steps the iOS web-clip storage sandbox, where the Safari
  // unlock flag doesn't exist).
  let unlocked = isStandaloneApp();
  try{
    if(h === TOOLS_KEY) localStorage.setItem('toolsUnlocked', '1');
    if(h === 'lock') localStorage.removeItem('toolsUnlocked');
    unlocked = unlocked || localStorage.getItem('toolsUnlocked') === '1';
  }catch(e){
    unlocked = unlocked || (h === TOOLS_KEY);   // storage blocked -> unlock this visit only
  }
  if(h === TOOLS_KEY || h === 'lock'){     // don't leave the key sitting in the address bar
    history.replaceState(null, '', location.pathname + location.search);
  }
  btn.hidden = !unlocked;
  // if Tools was open when it got locked, drop back to the public All Decks tab
  if(!unlocked && btn.classList.contains('active')){
    document.querySelector('.tab-btn[data-tab="collection"]').click();
  }
}
window.addEventListener('hashchange', applyToolsGate);
applyToolsGate();

init();
</script>
